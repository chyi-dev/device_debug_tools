<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设备调试工具 · 应答教程 · 课表</title>
<style>
/* ---------- 设计 token：白底经典 / 黑底经典 ---------- */
:root{
  --win:#e9edf1;--panel:#f7f8fa;--field:#fff;--line:#c5ced7;--line2:#dfe4e9;
  --text:#1f2933;--muted:#56616e;--accent:#1769c2;--accent-ink:#fff;--hover:#e3ebf5;
  --log-bg:#fff;--log-prompt:#6b7480;--log-rx:#1b2630;--log-tx:#1461b8;--log-sys:#9a5a00;--mark:#ffe28a;
  --on:#1f9d55;--off:#c8392f;--lamp-idle:#b9c1ca;
  --sans:"Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --win:#16191d;--panel:#1f2329;--field:#272c33;--line:#3a414a;--line2:#2e343c;
  --text:#e3e7ec;--muted:#a1aab5;--accent:#4c9bf0;--accent-ink:#0c1624;--hover:#2b323b;
  --log-bg:#0d1013;--log-prompt:#8b949e;--log-rx:#7fe0a6;--log-tx:#8cc2ff;--log-sys:#e5b54a;--mark:#6b5a12;
  --on:#3ccf7a;--off:#ef5b50;--lamp-idle:#4a525c;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.45 var(--sans);color:var(--text);background:var(--win);overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:15px;height:15px;margin:0}
.app{height:100vh;display:grid;grid-template-rows:34px minmax(0,1fr) 30px;min-width:1180px}

/* ---------- 菜单栏 ---------- */
.menubar{display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:20}
.menubar .title{font-weight:600;margin-right:14px;padding-left:4px}
.menu{position:relative}
.menu>button{border:0;background:none;height:28px;padding:0 12px;border-radius:4px}
.menu>button:hover,.menu.open>button{background:var(--hover)}
.drop{display:none;position:absolute;top:31px;left:0;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 28px rgba(0,0,0,.16);padding:4px}
.menu.open .drop{display:block}
.drop button{display:flex;justify-content:space-between;width:100%;border:0;background:none;text-align:left;padding:7px 12px;border-radius:4px;gap:20px}
.drop button:hover{background:var(--hover)}
.drop button kbd,.drop button .chk{font:12px var(--mono);color:var(--muted)}
.drop hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
.menubar .right{margin-left:auto;display:flex;gap:6px}
.iconbtn{border:1px solid transparent;background:none;height:26px;padding:0 10px;border-radius:4px;font-size:13px;color:var(--muted)}
.iconbtn:hover{border-color:var(--line);color:var(--text)}
.iconbtn.on{color:var(--text);border-color:var(--line);background:var(--field)}

/* ---------- 主体三栏 ---------- */
.main{display:grid;grid-template-columns:272px minmax(0,1fr) 352px;gap:8px;padding:8px;min-height:0}
.app.compact .main{grid-template-columns:0 minmax(0,1fr) 352px;gap:0 8px}
.app.notools .main{grid-template-columns:272px minmax(0,1fr) 0;gap:8px 0}
.app.compact.notools .main{grid-template-columns:0 minmax(0,1fr) 0;gap:0}
.app.compact .side,.app.notools .tools{visibility:hidden;overflow:hidden}

/* 左栏分组框 */
.side{overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:6px;min-height:0;padding-right:2px}
.group{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:7px 12px 8px}
.group>legend,.group>.legend{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-bottom:6px;display:block}
.form{display:grid;grid-template-columns:62px minmax(0,1fr);gap:5px 8px;align-items:center}
.form select,.form .inp{height:26px}
.form label{font-size:13px;color:var(--muted)}
.form .pair{display:flex;gap:6px}
.form .pair>*{flex:1;min-width:0}
select,.inp{height:28px;border:1px solid var(--line);border-radius:4px;background:var(--field);padding:0 6px;outline:none;min-width:0}
select:focus,.inp:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
.btn{height:28px;border:1px solid var(--line);border-radius:4px;background:var(--field);padding:0 12px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:24px;padding:0 8px;font-size:13px}
.btn.danger{color:var(--off)}
.openrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.openbtn{flex:1;height:32px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.lamp{width:12px;height:12px;border-radius:50%;background:var(--off);box-shadow:inset 0 -1px 2px rgba(0,0,0,.25)}
.lamp.on{background:var(--on)}
.signals{display:flex;gap:16px;align-items:center;margin-top:8px;font-size:13px}
.signals label{display:flex;gap:6px;align-items:center}
.pins{display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid var(--line2);font:12px var(--mono);color:var(--muted)}
.pins span{display:flex;align-items:center;gap:4px}
.pins i{width:8px;height:8px;border-radius:50%;background:var(--lamp-idle)}
.pins i.on{background:var(--on)}
.radios{display:flex;gap:16px;margin-bottom:6px}
.legend.withradio{display:flex;justify-content:space-between;align-items:center}
.legend.withradio .radios{margin:0;font-size:14px;font-weight:400;color:var(--text);letter-spacing:0}
.radios label,.checks label{display:flex;align-items:center;gap:7px}
.checks{display:flex;flex-direction:column;gap:4px}
.checks .with{display:flex;align-items:center;justify-content:space-between;gap:6px}
.checks .with select,.checks .with .inp{height:24px;width:96px;font-size:13px}
.checks .file{font:12px var(--mono);color:var(--muted);padding-left:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links{display:flex;gap:14px;margin-top:8px;font-size:13px}
.links button{border:0;background:none;color:var(--accent);padding:0}
.links button:hover{text-decoration:underline}

/* ---------- 中间：数据日志 + 发送 ---------- */
.center{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px;min-height:0}
.logbox{border:1px solid var(--line);border-radius:6px;background:var(--log-bg);display:grid;grid-template-rows:36px minmax(0,1fr);min-height:0;overflow:hidden}
.loghead{display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.loghead b{font-weight:600}
.loghead .meta{font:12px var(--mono);color:var(--muted)}
.loghead .search{margin-left:auto;width:220px;height:26px;font-size:13px}
.log{overflow:auto;padding:10px 12px;font:14px/1.6 var(--mono);color:var(--log-rx);white-space:pre}
.log.wrap{white-space:pre-wrap;word-break:break-all}
.log .p{color:var(--log-prompt)}
.log .rx{color:var(--log-rx)}
.log .tx{color:var(--log-tx)}
.log .sys{color:var(--log-sys)}
.log mark{background:var(--mark);color:inherit;border-radius:2px}
.log .hint{color:var(--muted);font-family:var(--sans)}
.sendbox{border:1px solid var(--line);border-radius:6px;background:var(--panel);display:grid;grid-template-columns:minmax(0,1fr) 120px;overflow:hidden}
.sendbox textarea{border:0;border-right:1px solid var(--line);background:var(--field);resize:none;height:104px;padding:10px 12px;font:15px/1.5 var(--mono);outline:none}
.sendside{display:flex;flex-direction:column;gap:6px;padding:8px}
.sendbtn{flex:1;font-size:16px}
.sendbtn.looping{background:var(--off);border-color:var(--off);color:#fff}
.sendfoot{grid-column:1/-1;display:flex;gap:16px;align-items:center;padding:5px 12px;border-top:1px solid var(--line2);font:12px var(--mono);color:var(--muted)}
.sendfoot .err{color:var(--off)}

/* ---------- 右侧工具面板 ---------- */
.tools{border:1px solid var(--line);border-radius:6px;background:var(--panel);display:grid;grid-template-rows:38px minmax(0,1fr);min-height:0;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 4px}
.tabs button{flex:1;border:0;background:none;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;padding:0 2px;white-space:nowrap}
.tabs button.on{color:var(--text);font-weight:600;border-color:var(--accent)}
.tabbody{overflow:auto;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--panel);z-index:1}
.bar .grow{flex:1}
.bar .note{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line2)}
.it:hover{background:var(--hover)}
.it .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .dt{grid-column:2;font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .ops{grid-column:3;grid-row:1/span 2;display:flex;gap:4px;align-items:center}
.it .lead{grid-row:1/span 2}
.it .key{font:12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.it.active{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.it.in{padding-left:26px}
.fd{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line2);cursor:pointer}
.fd:hover{background:var(--hover)}
.fd .arw{width:12px;color:var(--muted);font-size:10px}
.fd .nm{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd .cnt{font-size:12px;color:var(--muted);margin-right:4px}
.explain.in{padding-left:26px}
.link{border:0;background:none;color:var(--muted);font-size:13px;padding:2px 4px;border-radius:3px}
.link:hover{color:var(--text);background:var(--line2)}
.link.danger:hover{color:var(--off)}
.sw{width:32px;height:18px;border-radius:9px;background:var(--lamp-idle);position:relative;border:0;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--on)}
.sw.on::after{left:16px}
.hits{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.steps{width:100%;border-collapse:collapse;font-size:13px}
.steps th{font-weight:600;font-size:12px;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line2)}
.steps td{padding:6px 10px;border-bottom:1px solid var(--line2);font-family:var(--mono)}
.steps tr.now td{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.steps td.note{font-family:var(--sans);color:var(--muted)}
.batchmeta{display:flex;gap:14px;align-items:center;padding:8px 10px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line2);flex-wrap:wrap}
.batchmeta .inp{width:56px;height:24px}
.batchmeta label{display:flex;align-items:center;gap:6px}
.prog{height:3px;background:var(--line2)}
.prog i{display:block;height:3px;background:var(--accent);transition:width .2s}
.explain{font-size:12px;color:var(--muted);padding:10px;line-height:1.6}
.hist .it{grid-template-columns:auto minmax(0,1fr) auto}
.hist .time{font:12px var(--mono)}
.calc{padding:10px;display:flex;flex-direction:column;gap:8px}
.calc textarea{height:84px;border:1px solid var(--line);border-radius:4px;background:var(--field);padding:8px;font:14px var(--mono);resize:vertical;outline:none}
.calc .radios{margin:0}
.calc table{width:100%;border-collapse:collapse;font-size:13px}
.calc td{padding:7px 4px;border-bottom:1px solid var(--line2)}
.calc td.v{font:600 14px var(--mono)}
.calc td.a{text-align:right}
/* 「脚本」会改动中间列，用竖线与其他页签隔开 */
.tabs button{font-size:12px}
.tabs .sctab{flex:none;padding:0 12px;margin-left:4px;position:relative}
.tabs .sctab::before{content:"";position:absolute;left:-3px;top:10px;bottom:10px;border-left:1px solid var(--line)}
.schook{font:12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px;white-space:nowrap}
.it.sc{cursor:pointer}
.it.sc .dt{display:flex;gap:6px;align-items:center}
.it.sc.off .nm{color:var(--muted)}
.scdock{display:none}
.center.withdock{grid-template-rows:minmax(0,1fr) 312px auto}
.center.withdock .scdock{display:grid;grid-template-rows:auto minmax(0,1fr);border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden;min-height:0}
.scdock>.schead{border-bottom:1px solid var(--line)}
.scbody{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.sclogbox{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.schead{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line2);background:var(--panel)}
.schead b{color:var(--text);font-weight:600;font-size:13px}
.schead .grow{flex:1}
.sclog{font:12px/1.55 var(--mono);overflow:auto;min-height:0;background:var(--log-bg)}
.sclog-row{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;padding:3px 10px;border-bottom:1px solid var(--line2)}
.sclog-row .t{color:var(--log-prompt)}
.sclog-row .n{color:var(--log-tx)}
.sclog-row .o{color:var(--log-rx);word-break:break-all}
.sclog-row.err .o{color:var(--off)}
.sclog-empty{font:12px/1.6 var(--sans);color:var(--muted);padding:10px}
.sced{display:grid;grid-template-columns:auto minmax(0,1fr);border-right:1px solid var(--line);background:var(--log-bg);overflow:hidden;min-height:0}
.sced .gut{margin:0;padding:8px 6px 8px 10px;font:13px/1.55 var(--mono);color:var(--log-prompt);text-align:right;background:var(--panel);border-right:1px solid var(--line2);overflow:hidden;user-select:none;min-width:34px}
.sced textarea{border:0;outline:none;resize:none;padding:8px 10px;font:13px/1.55 var(--mono);color:var(--log-rx);background:transparent;white-space:pre;overflow:auto;tab-size:2;min-height:0;height:100%}
.sced:focus-within{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
/* 脚本页「我的脚本 / 教程」切换与课表 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--field);height:24px;padding:0 10px;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.it.tut{cursor:pointer}
.it.tut .dt{display:flex;gap:6px;align-items:center;font-family:var(--sans)}
.tutno{font:600 12px var(--mono);color:var(--muted);min-width:18px;text-align:right}
.tutopen{display:flex;flex-direction:column;gap:8px;padding:10px 10px 12px 38px;border-bottom:1px solid var(--line2)}
.tuttext{font-size:13px;line-height:1.6}
.tutcode{margin:0;font:12px/1.55 var(--mono);color:var(--log-rx);background:var(--log-bg);border:1px solid var(--line2);border-radius:4px;padding:8px 10px;white-space:pre;overflow:auto}
.tutsample{font:12px var(--mono);color:var(--muted)}
.tutacts{display:flex;gap:6px;align-items:center}

/* ---------- 状态栏 ---------- */
.status{display:flex;align-items:center;gap:0;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.status>span{padding:0 12px;border-right:1px solid var(--line2);display:flex;align-items:center;gap:6px;height:100%}
.status b{color:var(--text);font:600 12px var(--mono)}
.status .conn{font-family:var(--mono);color:var(--text)}
.status .lamp{width:9px;height:9px}
.status button{border:0;background:none;color:var(--accent);font-size:12px;padding:0}
.status .saving{color:var(--log-sys)}
.status .last{margin-left:auto;border-right:0;border-left:1px solid var(--line2)}

/* ---------- 对话框 / 提示 ---------- */
.modal{position:fixed;inset:0;background:rgba(10,14,20,.38);display:none;align-items:center;justify-content:center;z-index:50}
.modal.show{display:flex}
.dialog{width:min(640px,92vw);max-height:86vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 20px 48px rgba(0,0,0,.25)}
.dialog h3{font-size:15px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.dialog .body{padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.dialog .foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line2)}
.dialog .row{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:center}
.dialog .row>label{font-size:13px;color:var(--muted)}
.dialog .sub{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin-top:4px}
.dialog .lines{display:flex;flex-direction:column;gap:6px}
.dialog .line{display:grid;grid-template-columns:22px 92px minmax(0,1fr) 28px;gap:6px;align-items:center}
.dialog .line.bat{grid-template-columns:22px 92px minmax(0,1fr) 150px 28px}
.dialog .line span{font:12px var(--mono);color:var(--muted);text-align:right}
.dialog .line .inp{font-family:var(--mono)}
.dialog .line .note{font-family:var(--sans)}
.dialog .err{color:var(--off);font-size:13px;min-height:18px}.dialog .keys{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px}
.dialog .keys kbd{font:13px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;background:var(--field);justify-self:start}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--text);color:var(--win);padding:9px 16px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.toast.warn{background:var(--off);color:#fff}
</style>
<style>
/* 规则编辑器加宽：左表单，右教程。颜色只用调试台已有 token。 */
.dialog.wide{width:min(1040px,96vw);height:min(800px,92vh)}
.dialog .body.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:0;padding:0;overflow:hidden}
.ruleform{min-width:0;min-height:0;overflow:auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.ruleform .hot{outline:1px solid var(--accent);outline-offset:1px;border-radius:4px}
.rail{min-width:0;min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--win)}
.railhead{padding:12px 14px 10px;border-bottom:1px solid var(--line2)}
.railhead b{display:block;font-size:14px;font-weight:600}
.railhead span{display:block;margin-top:2px;font-size:12px;line-height:1.5;color:var(--muted)}
.glab{padding:10px 14px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.tuttext{margin:0;font-size:14px;line-height:1.6;text-wrap:pretty}
.recipe{font:13px/1.5 var(--mono);color:var(--text);overflow-wrap:anywhere}
.strip{display:flex;flex-direction:column;gap:6px}
.slab{font-size:12px;color:var(--muted)}
.bytes{display:flex;flex-wrap:wrap;gap:4px}
.bytes span{min-width:40px;padding:4px 6px 3px;background:var(--field);border:1px solid var(--line);border-radius:4px;font:600 13px/1.2 var(--mono);text-align:center;color:var(--text)}
.bytes span small{display:block;margin-top:3px;font:400 12px/1.2 var(--sans);color:var(--muted)}
.bytes span.cap{background:var(--mark);border-color:transparent}
.bytes span.cap small{color:var(--text)}
.bytes span.dim{color:var(--muted);font-weight:500}
.snote{margin:0;font-size:12px;line-height:1.5;color:var(--muted);text-wrap:pretty}
.tx{display:grid;grid-template-columns:64px minmax(0,1fr);column-gap:8px;align-items:baseline}
.tx code{font:600 13px var(--mono);color:var(--log-tx)}
.tx .ms{font:12px var(--mono);color:var(--muted)}
.tx .from{grid-column:2;font-size:12px;color:var(--muted)}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th,.cmp td{text-align:left;padding:4px 6px 4px 0;border-bottom:1px solid var(--line2);font-weight:400}
.cmp th{font-size:12px;color:var(--muted);font-weight:600}
.cmp th.hex{font-family:var(--mono);font-weight:500}
.cmp td.yes{font-weight:600}
.cmp td.no{color:var(--muted)}
.wrote{margin:0;font-size:12px;line-height:1.5;color:var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* 版 A：右侧是一份可展开的课表，说明嵌在被点开的那一行下面。 */
.rscroll{flex:1;min-height:0;overflow:auto}
.lrow{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);background:transparent;padding:8px 14px}
.lrow:hover,.lrow.on{background:var(--hover)}
.lrow .ti{display:flex;gap:8px;align-items:baseline;font-size:14px;font-weight:600}
.lrow .no{flex:none;width:16px;font:600 12px var(--mono);color:var(--muted);text-align:right}
.lrow .br{display:block;margin:2px 0 0 24px;font-size:12px;font-weight:400;color:var(--muted)}
.lbody{display:flex;flex-direction:column;gap:10px;padding:2px 14px 14px 38px;border-bottom:1px solid var(--line2);background:var(--panel)}
.lbody .acts{position:sticky;bottom:0;background:var(--panel);padding-top:8px}

<body>
<div class="app" id="app">
  <header class="menubar" id="menubar">
    <span class="title">设备调试工具</span>
    <div class="menu"><button>文件</button>
      <div class="drop">
        <button data-cmd="saveRecv">保存接收数据…<kbd>Ctrl+S</kbd></button>
        <hr>
        <button data-cmd="exportQuick">导出快捷指令</button>
        <button data-cmd="importQuick">导入快捷指令…</button>
        <button data-cmd="exportRules">导出应答规则</button>
        <button data-cmd="importRules">导入应答规则…</button>
      </div>
    </div>
    <div class="menu"><button>设置</button>
      <div class="drop">
        <button data-cmd="themeLight">白底经典<span class="chk" id="chkLight"></span></button>
        <button data-cmd="themeDark">黑底经典<span class="chk" id="chkDark"></span></button>
        <hr>
        <button data-cmd="compact">精简模式（收起左栏）<span class="chk" id="chkCompact"></span></button>
        <button data-cmd="toolsPanel">显示工具面板<span class="chk" id="chkTools"></span></button>

    </div>
    <div class="menu"><button>工具</button>
      <div class="drop">
        <button data-cmd="tab:quick">快捷指令</button>
        <button data-cmd="tab:batch">批量发送</button>
        <button data-cmd="tab:reply">自动应答</button>
        <button data-cmd="tab:history">历史发送</button>
        <button data-cmd="tab:calc">校验计算</button>
        <button data-cmd="tab:script">脚本</button>
      </div>
    </div>
    <div class="menu"><button>帮助</button>
      <div class="drop">
        <button data-cmd="keys">快捷键说明<kbd>F12</kbd></button>
        <button data-cmd="about">关于</button>
      </div>
    </div>
    <div class="right">
      <button class="iconbtn" id="btnCompact" title="收起或展开左侧设置栏">精简模式</button>
      <button class="iconbtn on" id="btnTools" title="显示或隐藏工具面板">工具面板</button>
    </div>
  </header>

  <main class="main">
    <!-- 左栏：串口 / 接收 / 发送设置 -->

        <span class="legend">串口设置</span>
        <div class="form">
          <label for="cfgPort">串口号</label>
          <div class="pair" style="flex:none"><select id="cfgPort" style="flex:1"></select><button class="btn sm" id="btnRefresh" title="重新扫描串口" style="flex:none">刷新</button></div>
          <label for="cfgBaud">波特率</label>
          <input class="inp" id="cfgBaud" list="baudList" value="115200" inputmode="numeric">
          <label for="cfgParity">校验位</label>
          <select id="cfgParity"><option value="N">NONE</option><option value="O">ODD</option><option value="E">EVEN</option><option value="M">MARK</option><option value="S">SPACE</option></select>
          <label for="cfgData">数据位</label>
          <select id="cfgData"><option>5</option><option>6</option><option>7</option><option selected>8</option></select>
          <label for="cfgStop">停止位</label>
          <select id="cfgStop"><option value="1">1</option><option value="1.5">1.5</option><option value="2">2</option></select>
          <label for="cfgFlow">流控</label>
          <select id="cfgFlow"><option value="NONE">NONE</option><option value="RTS/CTS">RTS/CTS</option><option value="DTR/DSR">DTR/DSR</option><option value="XON/XOFF">XON/XOFF</option></select>
        </div>
        <datalist id="baudList"><option>1200</option><option>2400</option><option>4800</option><option>9600</option><option>19200</option><option>38400</option><option>57600</option><option>115200</option><option>230400</option><option>460800</option><option>921600</option></datalist>
        <div class="openrow">
          <button class="btn openbtn" id="btnOpen"><i class="lamp" id="openLamp"></i><span id="openText">打开</span></button>
        </div>
        <div class="signals">
          <label><input type="checkbox" id="sigDtr">DTR</label>
          <label><input type="checkbox" id="sigRts">RTS</label>
        </div>
        <div class="pins" title="引脚状态（由下位机回环模拟）">
          <span><i id="pinDcd"></i>DCD</span><span><i id="pinDsr"></i>DSR</span><span><i id="pinCts"></i>CTS</span><span><i id="pinRi"></i>RI</span>
        </div>
      </section>

      <section class="group">
        <div class="legend withradio"><span>接收设置</span><div class="radios">
          <label><input type="radio" name="rxFmt" value="ASCII">ASCII</label>
          <label><input type="radio" name="rxFmt" value="HEX" checked>HEX</label>
        </div></div>
        <div class="checks">
          <label><input type="checkbox" id="rxLog" checked>按日志模式显示</label>
          <label><input type="checkbox" id="rxWrap" checked>接收区自动换行</label>
          <label><input type="checkbox" id="rxHide">接收数据不显示</label>
          <label><input type="checkbox" id="rxSave">接收保存到文件</label>
          <label><input type="checkbox" id="rxScroll" checked>自动滚屏</label>
          <div class="with"><span>分包超时</span><span><input class="inp" id="rxTimeout" value="20" style="width:56px"> ms</span></div>
        </div>
        <div class="links"><button id="lnkSaveRecv">保存数据</button><button id="lnkClear">清除接收</button></div>
      </section>

      <section class="group">
        <div class="legend withradio"><span>发送设置</span><div class="radios">
          <label><input type="radio" name="txFmt" value="ASCII">ASCII</label>
          <label><input type="radio" name="txFmt" value="HEX" checked>HEX</label>
        </div></div>
        <div class="checks">
          <label><input type="checkbox" id="txEscape" checked>自动解析转义符</label>
          <label><input type="checkbox" id="txAt">AT 指令自动回车</label>
          <label><input type="checkbox" id="txCrlf">末尾追加回车换行</label>
          <div class="with"><label><input type="checkbox" id="txCk">自动发送附加位</label>
            <select id="txCkType"><option value="sum">SUM8</option><option value="xor">XOR/BCC</option><option value="lrc">LRC</option><option value="crc8">CRC8</option><option value="crc16" selected>CRC16</option><option value="crc32">CRC32</option></select></div>
          <label><input type="checkbox" id="txClear">发送完自动清空</label>
          <label><input type="checkbox" id="txFile">打开文件数据源…</label>
          <div class="file" id="txFileName" hidden></div>
          <div class="with"><label><input type="checkbox" id="txLoop">循环周期</label><span><input class="inp" id="txPeriod" value="1000" style="width:64px"> ms</span></div>
        </div>
        <div class="links"><button data-cmd="tab:quick">快捷指令</button><button data-cmd="tab:history">历史发送</button></div>
      </section>
    </aside>

    <!-- 中间：数据日志 + 发送框 -->
    <section class="center">
      <div class="logbox">
        <div class="loghead">
          <b>数据日志</b>
          <span class="meta" id="logMeta"></span>
          <input class="inp search" id="logSearch" placeholder="搜索接收内容" spellcheck="false">
        </div>
        <div class="log wrap" id="log"></div>
      </div>
      <div class="scdock" id="scDock"></div>
      <div class="sendbox">
        <textarea id="txInput" spellcheck="false">A5 01 00 00 01 07</textarea>
        <div class="sendside">
          <button class="btn pri sendbtn" id="btnSend">发送</button>
          <button class="btn" id="btnClearTx">清除</button>
        </div>
        <div class="sendfoot"><span id="txPreview"></span><span style="margin-left:auto">Ctrl+Enter 发送 · Esc 停止循环/批量</span></div>
      </div>
    </section>

    <!-- 右侧：工具面板 -->
    <section class="tools">
      <nav class="tabs" id="tabs">
        <button data-tab="quick" class="on">快捷指令</button>
        <button data-tab="batch">批量发送</button>
        <button data-tab="reply">自动应答</button>
        <button data-tab="history">历史发送</button>
        <button data-tab="calc">校验计算</button>
        <button data-tab="script" class="sctab">脚本</button>
      </nav>
      <div class="tabbody" id="tabbody"></div>
    </section>
  </main>

  <footer class="status">
    <span><i class="lamp" id="stLamp"></i><span class="conn" id="stConn"></span></span>
    <span>RX: <b id="stRx">0</b></span>
    <span>TX: <b id="stTx">0</b></span>
    <span><button id="btnReset">复位计数</button></span>
    <span id="stReply"></span>
    <span class="saving" id="stSave" hidden></span>
    <span class="last" id="stHint">就绪</span>

</div>

<div class="modal" id="modal"><div class="dialog"><h3 id="dlgTitle"></h3><div class="body" id="dlgBody"></div><div class="foot" id="dlgFoot"></div></div></div>

<script>
// 模拟串口引擎：三版设计稿共用，界面只订阅事件、调用方法。
var Serial = (function () {
  var PORTS = [
    { id: 'COM3', label: 'COM3 · USB-SERIAL CH340' },
    { id: 'COM5', label: 'COM5 · Bluetooth Link' },
    { id: 'USB0', label: 'USB0 · FTDI FT232R' }
  ];
  var listeners = {};
  var seq = 0;
  var deviceTimer = null;
  var loopTimer = null;
  var batchRun = null;
  var temp = 246, hum = 521;

  var state = {
    open: false,
    port: 'COM3',
    baud: 115200, dataBits: 8, parity: 'N', stopBits: 1, flow: '无', encoding: 'UTF-8',
    rx: 0, tx: 0,
    lines: [],
    history: ['A5 01 00 00 01 07', 'A5 02 00 00 02 08'],
    sendFormat: 'HEX', checksum: 'none', crlf: false,
    escape: true, atCrlf: false, packetTimeout: 20,
    dtr: false, rts: false,
    pins: { dcd: false, dsr: false, cts: false, ri: false },
    streaming: false,
    rules: [
      { id: 'r1', name: '温湿度回包确认', match: 'prefix', pattern: 'A5 5A 03', enabled: true, hits: 0,
        replies: [{ data: 'A5 A0 00 A0', delay: 80 }, { data: 'A5 A1 01 A2', delay: 120 }] },
      { id: 'r2', name: '设备上线确认', match: 'frame', pattern: 'A5 81 00 00 81', enabled: true, hits: 0,
        replies: [{ data: 'A5 02 00 00 02 08', delay: 50 }] },
      { id: 'r3', name: '校验失败重发', match: 'contains', pattern: 'EE', enabled: false, hits: 0,
        replies: [{ data: 'A5 01 00 00 01 07', delay: 200 }] }
    ],
    quick: [
      { id: 'q1', name: '读取温湿度', data: 'A5 01 00 00 01 07', key: 'F1' },
      { id: 'q2', name: '读取设备信息', data: 'A5 02 00 00 02 08', key: 'F2' },
      { id: 'q3', name: '启动采集', data: 'A5 10 01 00 11', key: 'F3' },
      { id: 'q4', name: '停止采集', data: 'A5 10 00 00 10', key: 'F4' }
    ],
    batch: [
      { id: 'b1', name: '传感器启动流程', interval: 500, stopOnFail: true,
        steps: ['A5 02 00 00 02 08', 'A5 10 01 00 11', 'A5 01 00 00 01 07'] },
      { id: 'b2', name: '设备复位自检', interval: 800, stopOnFail: true,
        steps: ['A5 10 00 00 10', 'A5 02 00 00 02 08', 'A5 01 00 00 01 07', 'A5 10 01 00 11'] }
    ],
    // Lua 脚本：on_receive 收到数据后运行；before_send 拦截每一帧发送，返回处理后的帧再发出，返回 nil 则不发
    scripts: [
      { id: 's1', name: 'parse_sensor.lua', action: 'parse', enabled: true, runs: 0, last: '',
        code: '-- 收到 A5 5A 03 帧后解析温湿度\nfunction on_receive(frame)\n  if frame:starts_with(0xA5, 0x5A, 0x03) then\n    local t = frame:u16(4) / 10\n    local h = frame:u16(6) / 10\n    log(string.format("temp=%.1f℃ hum=%.1f%%", t, h))\n  end\nend' },
      { id: 's2', name: 'add_checksum.lua', action: 'checksum', enabled: false, runs: 0, last: '',
        code: '-- 发送前拦截：帧尾追加 SUM8 后再发出\n-- 返回 nil 表示拦截，这一帧不发送\nfunction before_send(frame)\n  return frame:append(sum8(frame))\nend' }
    ],
    scriptLog: []
  };

  function on(type, fn) { (listeners[type] = listeners[type] || []).push(fn); }
  function emit(type, payload) { (listeners[type] || []).forEach(function (fn) { fn(payload); }); }

  // ---------- 字节工具 ----------
  function parseHex(text) {
    var clean = text.replace(/0x/gi, '').replace(/[^0-9a-fA-F]/g, '');
    if (!clean.length || clean.length % 2) return null;
    var out = [];
    for (var i = 0; i < clean.length; i += 2) out.push(parseInt(clean.substr(i, 2), 16));
    return out;
  }
  function textBytes(text, escape) {
    if (escape === false) return Array.from(new TextEncoder().encode(text));
    // 先把转义序列换成占位的原始字节，避免被 UTF-8 编码二次处理
    var out = [], i = 0;
    while (i < text.length) {
      var rest = text.slice(i), m;
      if ((m = /^\\x\[([0-9a-fA-F\s]*)\]/.exec(rest))) { out = out.concat(parseHex(m[1]) || []); i += m[0].length; continue; }
      if ((m = /^\\x([0-9a-fA-F]{2})/.exec(rest))) { out.push(parseInt(m[1], 16)); i += m[0].length; continue; }
      if ((m = /^\\([rnt0\\])/.exec(rest))) { out.push({ r: 13, n: 10, t: 9, '0': 0, '\\': 92 }[m[1]]); i += 2; continue; }
      var ch = text.codePointAt(i), s = String.fromCodePoint(ch);
      out = out.concat(Array.from(new TextEncoder().encode(s)));
      i += s.length;
    }
    return out;
  }
  function hex(bytes) { return bytes.map(function (b) { return (b < 16 ? '0' : '') + b.toString(16).toUpperCase(); }).join(' '); }
  function ascii(bytes) { return bytes.map(function (b) { return b >= 32 && b < 127 ? String.fromCharCode(b) : '.'; }).join(''); }
  function sum8(bytes) { return bytes.reduce(function (a, b) { return (a + b) & 0xFF; }, 0); }
  function xor8(bytes) { return bytes.reduce(function (a, b) { return a ^ b; }, 0); }
  function crc16(bytes) {
    var crc = 0xFFFF;
    bytes.forEach(function (b) {
      crc ^= b;
      for (var i = 0; i < 8; i++) crc = crc & 1 ? (crc >> 1) ^ 0xA001 : crc >> 1;
    });
    return [crc & 0xFF, crc >> 8];
  }
  function lrc(bytes) { return (-sum8(bytes)) & 0xFF; }
  function crc8(bytes) {
    var crc = 0;
    bytes.forEach(function (b) {
      crc ^= b;
      for (var i = 0; i < 8; i++) crc = crc & 0x80 ? ((crc << 1) ^ 0x07) & 0xFF : (crc << 1) & 0xFF;
    });
    return crc;
  }
  function crc32(bytes) {
    var crc = 0xFFFFFFFF;
    bytes.forEach(function (b) {
      crc ^= b;
      for (var i = 0; i < 8; i++) crc = crc & 1 ? (crc >>> 1) ^ 0xEDB88320 : crc >>> 1;
    });
    crc = (crc ^ 0xFFFFFFFF) >>> 0;
    return [crc >>> 24, (crc >>> 16) & 0xFF, (crc >>> 8) & 0xFF, crc & 0xFF];
  }
  // 返回要追加的校验字节；CRC16 为 MODBUS 低字节在前，CRC32 为大端
  function checksumBytes(bytes, kind) {
    if (kind === 'sum') return [sum8(bytes)];
    if (kind === 'xor') return [xor8(bytes)];
    if (kind === 'lrc') return [lrc(bytes)];
    if (kind === 'crc8') return [crc8(bytes)];
    if (kind === 'crc16') return crc16(bytes);
    if (kind === 'crc32') return crc32(bytes);
    return [];
  }
  function withChecksum(bytes, kind) { return bytes.concat(checksumBytes(bytes, kind)); }

  // ---------- 帧解析：返回字段列表，供详情树和字节高亮 ----------
  function dissect(bytes) {
    if (!bytes || bytes[0] !== 0xA5) return { summary: ascii(bytes || []), fields: [] };
    var f = [{ name: '帧头', from: 0, to: 1, value: '0xA5' }];
    if (bytes[1] === 0x5A && bytes[2] === 0x03 && bytes.length >= 8) {
      var t = ((bytes[3] << 8) | bytes[4]) / 10, h = ((bytes[5] << 8) | bytes[6]) / 10;
      var ok = sum8(bytes.slice(0, 7)) === bytes[7];
      f.push({ name: '应答标识', from: 1, to: 2, value: '0x5A' },
        { name: '命令', from: 2, to: 3, value: '0x03 温湿度上报' },
        { name: '温度', from: 3, to: 5, value: t.toFixed(1) + ' ℃' },
        { name: '湿度', from: 5, to: 7, value: h.toFixed(1) + ' %RH' },
        { name: '校验 SUM8', from: 7, to: 8, value: ok ? '正确' : '错误', ok: ok });
      return { summary: '温度 ' + t.toFixed(1) + ' ℃ · 湿度 ' + h.toFixed(1) + ' %RH', fields: f, temp: t, hum: h, ok: ok };
    }
    if (bytes[1] === 0x5A && bytes[2] === 0x82) {
      var info = ascii(bytes.slice(3, bytes.length - 1));
      f.push({ name: '应答标识', from: 1, to: 2, value: '0x5A' },
        { name: '命令', from: 2, to: 3, value: '0x82 设备信息' },
        { name: '型号 / 固件', from: 3, to: bytes.length - 1, value: info },
        { name: '校验 SUM8', from: bytes.length - 1, to: bytes.length, value: '正确', ok: true });
      return { summary: '设备信息 ' + info, fields: f, ok: true };
    }
    var names = { 0x01: '读取温湿度', 0x02: '读取设备信息', 0x10: '采集开关', 0x81: '上线确认', 0xA0: '主机确认', 0xA1: '主机确认（第二包）' };
    var name = names[bytes[1]] || '未知命令';
    f.push({ name: '命令', from: 1, to: 2, value: '0x' + hex([bytes[1]]) + ' ' + name });
    if (bytes.length > 3) f.push({ name: '参数', from: 2, to: bytes.length - 1, value: hex(bytes.slice(2, bytes.length - 1)) });
    if (bytes.length > 2) f.push({ name: '校验', from: bytes.length - 1, to: bytes.length, value: '0x' + hex([bytes[bytes.length - 1]]) });
    var extra = bytes[1] === 0x10 ? (bytes[2] ? ' · 开启' : ' · 关闭') : '';
    return { summary: name + extra, fields: f };
  }

  // ---------- 缓冲区 ----------
  function push(dir, bytes, text) {
    var d = bytes ? dissect(bytes) : { summary: text, fields: [] };
    var line = { no: ++seq, time: new Date(), dir: dir, bytes: bytes, text: text || d.summary, info: d };
    state.lines.push(line);
    if (state.lines.length > 500) state.lines.shift();
    if (dir === 'rx') state.rx += bytes.length;
    if (dir === 'tx') state.tx += bytes.length;
    emit('line', line);
    emit('state', state);
    if (dir === 'rx') { receiveHooks(line); matchRules(bytes); }
    return line;
  }
  function sys(text) { return push('sys', null, text); }

  // ---------- 连接 ----------
  function configure(patch) { Object.assign(state, patch); emit('state', state); }
  function portLabel() { var p = PORTS.filter(function (x) { return x.id === state.port; })[0]; return p ? p.label : state.port; }
  function frameFormat() { return state.dataBits + state.parity + state.stopBits; }
  // 模拟下位机把 DTR 回环到 DSR、RTS 回环到 CTS，连上即有 DCD
  function updatePins() {
    state.pins.dcd = state.open;
    state.pins.dsr = state.open && state.dtr;
    state.pins.cts = state.open && state.rts;
    emit('pins', state.pins);
  }
  function setSignal(name, on) { state[name] = !!on; updatePins(); emit('state', state); }
  function ring() {
    if (!state.open) return;
    state.pins.ri = true; emit('pins', state.pins);
    setTimeout(function () { state.pins.ri = false; emit('pins', state.pins); }, 600);
  }
  function open() {
    if (state.open) return;
    state.open = true;
    sys(state.port + ' 已打开 · ' + state.baud + ' ' + frameFormat());
    updatePins();
    emit('state', state);
    setTimeout(function () { if (state.open) device([0xA5, 0x81, 0x00, 0x00, 0x81]); }, 400);
  }
  function close() {
    if (!state.open) return;
    state.open = false;
    stopStream(); stopLoop(); stopBatch(true);
    flushRx();

  var id = b.dataset.id, i = Number(b.dataset.i), act = b.dataset.act;
  if (act === 'quickSend') { var q = byId(allQuick(), id); Serial.send(q.data, { format: q.format, checksum: 'none', crlf: false, silentHistory: true }); }
  if (act === 'quickNew') editQuick(null);
  if (act === 'quickNewIn') editQuick(null, id);
  if (act === 'quickEdit') editQuick(byId(allQuick(), id));
  if (act === 'quickDel') confirmDel('快捷指令「' + byId(allQuick(), id).name + '」', function () { removeQuick(id); renderTab(); });
  if (act === 'folderToggle') { var f0 = byId(S.quick, id); f0.expanded = !f0.expanded; renderTab(); }
  if (act === 'folderNew') editFolder(null);
  if (act === 'folderEdit') editFolder(byId(S.quick, id));
  if (act === 'folderDel') {
    var fd = byId(S.quick, id);
    confirmDel('文件夹「' + fd.name + '」' + (fd.commands.length ? '会一并删除其中 ' + fd.commands.length + ' 条指令，' : ''), function () { removeQuick(id); renderTab(); });
  }
  if (act === 'batchRun') Serial.runBatch(ui.batchSel);
  if (act === 'batchStop') Serial.stopBatch();
  if (act === 'batchNew') editBatch(null);
  if (act === 'batchEdit') editBatch(byId(S.batch, ui.batchSel));
  if (act === 'batchDel') confirmDel('批量任务「' + byId(S.batch, ui.batchSel).name + '」', function () { S.batch = S.batch.filter(function (x) { return x.id !== ui.batchSel; }); ui.batchSel = S.batch[0] && S.batch[0].id; renderTab(); });
  if (act === 'ruleToggle') { var r = byId(S.rules, id); r.enabled = !r.enabled; hint(r.name + (r.enabled ? ' 已启用' : ' 已停用')); renderTab(); renderStatus(); }
  if (act === 'ruleFire') Serial.fireRule(id);
  if (act === 'ruleNew') editRule(null);
  if (act === 'ruleEdit') editRule(byId(S.rules, id));
  if (act === 'ruleDel') confirmDel('应答规则「' + byId(S.rules, id).name + '」', function () { S.rules = S.rules.filter(function (x) { return x.id !== id; }); renderTab(); renderStatus(); });
  if (act === 'histSend') Serial.send(S.history[i], { format: Serial.parseHex(S.history[i]) ? 'HEX' : 'ASCII' });
  if (act === 'histFill') { $('txInput').value = S.history[i]; preview(); $('txInput').focus(); }
  if (act === 'histDel') Serial.removeHistory(i);
  if (act === 'histClear') confirmDel('全部 ' + S.history.length + ' 条发送历史', function () { S.history.length = 0; renderTab(); });
  if (act === 'scToggle') { var sc = Serial.toggleScript(id); hint(sc.name + (sc.enabled ? ' 已启用 · ' + Serial.scriptHook(sc) : ' 已停用')); }
  if (act === 'scRun') Serial.runScript(id, $('txInput').value);
  if (act === 'scSel' && !(scUi.dock && scUi.sel === id)) { scUi.sel = id; scUi.dock = true; renderTab(); }
  if (act === 'scNew') { scUi.sel = Serial.newScript().id; scUi.dock = true; renderTab(); $('scCode').focus(); }
  if (act === 'scFold') { scUi.dock = false; renderTab(); }
  if (act === 'scClear') Serial.clearScriptLog();
  if (act === 'tutView') { tutUi.view = id; renderTab(); }
  if (act === 'tutOpen') { tutUi.open = tutUi.open === id ? null : id; renderTab(); }
  if (act === 'tutNew') {
    var ls = byId(LESSONS, id), ns = Serial.newScript(ls.name, ls.code);
    scUi.sel = ns.id; scUi.dock = true; tutUi.view = 'mine'; renderTab(); hint('已用「' + ls.title + '」新建 ' + ns.name);
  }
  if (act === 'tutTry') {
    var lt = byId(LESSONS, id);
    if (!scUi.dock && S.scripts.length) { scUi.dock = true; renderTab(); }
    Serial.logScript(lt.name, '样例试跑 · ' + lt.hook + ' ← ' + lt.sample);
    lt.out.forEach(function (t) { Serial.logScript(lt.name, t); });
    hint('样例试跑结果已写入运行日志');
  }
  if (act === 'calcFromTx') { var p = currentPayload(); ui.calcFmt = p.format; renderTab(); $('calcInput').value = p.text; calcUpdate(); }
  if (act === 'calcAppend') {
    var raw = ui.calcFmt === 'HEX' ? Serial.parseHex($('calcInput').value) : Serial.textBytes($('calcInput').value, true);
    var ck = Serial.hex(Serial.checksumBytes(raw, b.dataset.k));
    if (S.sendFormat !== 'HEX') { document.querySelector('[name=txFmt][value=HEX]').click(); }
    $('txInput').value = Serial.hex(raw) + ' ' + ck; preview();
    toast('已填入发送框：' + $('txInput').value);
  }
};

// 教程：六课，每课一段可直接运行的代码和一帧样例；out 是样例在真实引擎里的输出，设计稿直接回放
var LESSONS = [
  { id: 'l1', name: 'lesson1_hooks.lua', title: '脚本什么时候运行', hook: 'on_receive', brief: '两个钩子：收到数据后、发送数据前',
    text: '写一个叫 on_receive 的函数，每收到一包数据就会调用它，frame 是这一包的字节。写 before_send 则在每一帧发出前调用（发送、快捷指令、批量、自动应答都算），返回的帧才会真正发出。开关只控制自动运行；「运行」是用最近一帧或发送框内容试算，不会发数据。',
    code: '-- 收到一包数据后运行，frame 是这一包的字节\nfunction on_receive(frame)\n  log("收到", frame:len(), "字节")\nend\n',
    sample: 'A5 81 00 00 81', out: ['收到 5 字节'] },
  { id: 'l2', name: 'lesson2_print.lua', title: '把一帧打印出来', hook: 'on_receive', brief: 'log 输出到运行日志，帧会显示成 HEX',
    text: 'log 把内容写到右侧运行日志，多个参数用空格连起来；print 和 log 是同一个函数。直接传入帧会显示成 HEX，frame:sub(i, j) 取第 i 到第 j 字节，frame:str() 按 ASCII 转成文字。',
    code: 'function on_receive(frame)\n  log(frame)                     -- 整帧 HEX\n  log("帧头", frame:sub(1, 2))   -- 第 1~2 字节\n  log("末字节", frame:u8(frame:len()))\nend\n',
    sample: 'A5 5A 03 00 F6 02 09 03', out: ['A5 5A 03 00 F6 02 09 03', '帧头 A5 5A', '末字节 3'] },
  { id: 'l3', name: 'lesson3_parse.lua', title: '认帧头、取数值', hook: 'on_receive', brief: 'starts_with 判断帧头，u16 读两字节整数',
    text: 'frame:starts_with(0xA5, 0x5A, 0x03) 判断帧头；不是要的帧就 return 跳过。下标从 1 开始：u8(i) 读第 i 字节，u16(i) 把第 i、i+1 字节按大端拼成整数，小端用 u16le(i)。',
    code: '-- 温湿度帧：A5 5A 03 温度(2) 湿度(2) 校验\nfunction on_receive(frame)\n  if not frame:starts_with(0xA5, 0x5A, 0x03) then return end\n  local t = frame:u16(4) / 10\n  local h = frame:u16(6) / 10\n  log(string.format("温度 %.1f℃ 湿度 %.1f%%", t, h))\nend\n',
    sample: 'A5 5A 03 00 F6 02 09 03', out: ['温度 24.6℃ 湿度 52.1%'] },
  { id: 'l4', name: 'lesson4_checksum.lua', title: '发送前补校验', hook: 'before_send', brief: 'before_send 返回改过的帧，append 追加字节',
    text: 'before_send 收到即将发出的帧，返回什么就发什么。frame:append(...) 返回在末尾追加字节后的新帧；sum8 是累加和，xor8 是异或（BCC）。',
    code: '-- 发出前在帧尾补 SUM8\nfunction before_send(frame)\n  return frame:append(sum8(frame))\n  -- 改用异或校验：return frame:append(xor8(frame))\nend\n',
    sample: 'A5 01 00 00 01', out: ['A5 01 00 00 01 → A5 01 00 00 01 A7（试算，未发送）'] },
  { id: 'l5', name: 'lesson5_block.lua', title: '拦截不想发的帧', hook: 'before_send', brief: '返回 nil，这一帧就不发',
    text: 'before_send 返回 nil 时这一帧不会发出，系统日志会记一条拦截。其他帧要原样放行，记得 return frame。',
    code: '-- 不让「停止采集」发出去，其余照常\nfunction before_send(frame)\n  if frame:starts_with(0xA5, 0x10, 0x00) then\n    log("已拦截停止采集")\n    return nil\n  end\n  return frame\nend\n',
    sample: 'A5 10 00 00 10', out: ['已拦截停止采集', 'A5 10 00 00 10 → nil，这一帧会被拦截（试算，未发送）'] },
  { id: 'l6', name: 'lesson6_modbus.lua', title: 'Modbus 补 CRC16', hook: 'before_send', brief: 'crc16 返回低字节、高字节',
    text: 'crc16(frame) 按 Modbus 算法返回两个值：低字节、高字节，正好按 Modbus RTU 的顺序追加。frame(...) 可以从数字、字符串或别的帧拼出一个新帧。',
    code: '-- Modbus RTU：帧尾追加 CRC16，低字节在前\nfunction before_send(frame)\n  local lo, hi = crc16(frame)\n  return frame:append(lo, hi)\nend\n',
    sample: '01 03 00 00 00 01', out: ['01 03 00 00 00 01 → 01 03 00 00 00 01 84 0A（试算，未发送）'] }
];

function gutter(code) { var g = ''; for (var i = 1, n = code.split('\n').length; i <= n; i++) g += i + '\n'; return g; }
function dockHead(s) {
  return '<b>' + esc(s.name) + '</b><span class="schook">' + Serial.scriptHook(s) + '</span><span>' + (s.enabled ? '自动运行中' : '已停用，仅手动运行') + '</span>' +
    '<span class="grow"></span><span>Lua · 输入即保存 · Tab 缩进两格</span><button class="btn sm pri" data-act="scRun" data-id="' + s.id + '">运行</button><button class="link" data-act="scFold">收起</button>';
}
function renderDock() {
  var on = ui.tab === 'script' && scUi.dock, dock = $('scDock');

  if (!on) { dock.innerHTML = ''; return; }

    '<div class="scbody"><div class="sced"><pre class="gut" id="scGut">' + gutter(s.code) + '</pre><textarea id="scCode" spellcheck="false">' + esc(s.code) + '</textarea></div>' +
    '<div class="sclogbox"><div class="schead"><b>运行日志</b><span id="scCount">' + S.scriptLog.length + ' 条</span><span class="grow"></span><button class="link" data-act="scClear">清空</button></div>' +

    s.code = code.value; $('scGut').textContent = gutter(code.value);

  };
  code.onscroll = function () { $('scGut').scrollTop = code.scrollTop; };
  code.onkeydown = function (e) { if (e.key === 'Tab') { e.preventDefault(); code.setRangeText('  ', code.selectionStart, code.selectionEnd, 'end'); code.oninput(); } };
}
$('scDock').onclick = function (e) { $('tabbody').onclick(e); };

// ---------- 对话框 ----------
function dialog(title, body, buttons) {
  $('dlgTitle').textContent = title;
  $('dlgBody').innerHTML = body;
  $('dlgFoot').innerHTML = '';
  buttons.forEach(function (b) {
    var el = document.createElement('button');
    el.className = 'btn' + (b.pri ? ' pri' : '') + (b.danger ? ' danger' : '');
    el.textContent = b.text;
    el.onclick = function () { if (b.run && b.run() === false) return; closeDialog(); };
    $('dlgFoot').appendChild(el);
  });
  $('modal').classList.add('show');
  var first = $('dlgBody').querySelector('input,select,textarea'); if (first) first.focus();
}
function closeDialog() { $('modal').classList.remove('show'); }
$('modal').onmousedown = function (e) { if (e.target === this) closeDialog(); };
function fail(msg) { $('dlgErr').textContent = msg; return false; }
function confirmDel(what, run) { dialog('确认删除', '<p>删除' + esc(what) + '后无法恢复。</p>', [{ text: '取消' }, { text: '删除', pri: true, run: function () { run(); toast('已删除'); } }]); }
function validHex(v) { return !!Serial.parseHex(v); }

function editQuick(q, folderId) {
  var isNew = !q; q = q || { name: '', data: '', format: 'HEX', key: '' };
  var keys = ['', 'F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8'];
  var folders = quickFolders();
  var cur = isNew ? (folderId || '') : ((quickFolderOf(q.id) || {}).id || '');
  dialog(isNew ? '新增快捷指令' : '编辑快捷指令',
    '<div class="row"><label>名称</label><input class="inp" id="dName" value="' + esc(q.name) + '"></div>' +
    '<div class="row"><label>格式</label><select id="dFmt"><option' + (q.format === 'HEX' ? ' selected' : '') + '>HEX</option><option' + (q.format === 'ASCII' ? ' selected' : '') + '>ASCII</option></select></div>' +
    '<div class="row"><label>指令数据</label><input class="inp" id="dData" style="font-family:var(--mono)" value="' + esc(q.data) + '"></div>' +
    '<div class="row"><label>快捷键</label><select id="dKey">' + keys.map(function (k) { return '<option value="' + k + '"' + (k === q.key ? ' selected' : '') + '>' + (k || '无') + '</option>'; }).join('') + '</select></div>' +
    (folders.length ? '<div class="row"><label>文件夹</label><select id="dFolder"><option value="">根目录</option>' + folders.map(function (f) { return '<option value="' + f.id + '"' + (f.id === cur ? ' selected' : '') + '>' + esc(f.name) + '</option>'; }).join('') + '</select></div>' : '') +
    '<div class="err" id="dlgErr"></div>',
    [{ text: '取消' }, { text: '保存', pri: true, run: function () {
      var v = { name: $('dName').value.trim(), data: $('dData').value.trim(), format: $('dFmt').value, key: $('dKey').value };
      var target = $('dFolder') ? $('dFolder').value : '';
      if (!v.name) return fail('请填写名称');
      if (!v.data) return fail('请填写指令数据');
      if (v.format === 'HEX' && !validHex(v.data)) return fail('HEX 数据需为成对的十六进制字符');
      if (v.key) allQuick().forEach(function (x) { if (x !== q && x.key === v.key) x.key = ''; });
      if (isNew) q = Object.assign({ id: uid('q') }, v); else Object.assign(q, v);
      if (isNew || target !== cur) {
        removeQuick(q.id);
        var dest = byId(S.quick, target);
        (dest ? dest.commands : S.quick).push(q);
      }
      renderTab(); toast('快捷指令已保存');
    } }]);
}
function editFolder(f) {
  dialog(f ? '重命名文件夹' : '新增文件夹',
    '<div class="row"><label>名称</label><input class="inp" id="dName" value="' + esc(f ? f.name : '') + '"></div><div class="err" id="dlgErr"></div>',
    [{ text: '取消' }, { text: '保存', pri: true, run: function () {
      var name = $('dName').value.trim();
      if (!name) return fail('请填写文件夹名称');
      if (quickFolders().some(function (x) { return x !== f && x.name === name; })) return fail('已有同名文件夹');
      if (f) f.name = name; else S.quick.push({ type: 'folder', id: uid('f'), name: name, expanded: true, commands: [] });
      renderTab(); toast('文件夹已保存');
    } }]);
}
function editRule(r) {
  var isNew = !r; r = r || { name: '', match: 'prefix', pattern: '', enabled: true, hits: 0, replies: [{ data: '', delay: 50 }] };
  dialog(isNew ? '新增应答规则' : '编辑应答规则',
    '<div class="row"><label>规则名称</label><input class="inp" id="dName" value="' + esc(r.name) + '"></div>' +
    '<div class="row"><label>语法</label><select id="dKind"><option value="template">模板</option><option value="regex"' + (r.kind === 'regex' ? ' selected' : '') + '>正则</option></select></div>' +
    '<div class="row"><label>格式</label><select id="dFormat"><option value="HEX">HEX</option><option value="ASCII"' + (r.format === 'ASCII' ? ' selected' : '') + '>ASCII</option></select></div>' +
    '<div class="row" id="dMatchRow"><label>匹配方式</label><select id="dMatch">' + Object.keys(matchName).map(function (k) { return '<option value="' + k + '"' + (k === r.match ? ' selected' : '') + '>' + matchName[k] + '</option>'; }).join('') + '</select></div>' +

RT.no = function (l) { return RT.lessons.indexOf(l) + 1; };
RT.recipe = function (l) {
  var r = l.rule;
  var fmt = r.format === 'ASCII' ? 'ASCII' : 'HEX';
  if (r.kind === 'regex') return '正则 ' + fmt + ' · ' + r.pattern;
  return matchName[r.match] + ' ' + fmt + (r.ignoreCase ? ' Aa' : '') + ' · ' + r.pattern;
};

RT.strip = function (l) {
  return '<div class="strip"><div class="slab">收到</div><div class="bytes">' + l.rx.map(function (b) {
    return '<span class="' + (b.cap ? 'cap' : '') + (b.dim ? ' dim' : '') + '">' + esc(b.t) + '<small>' + esc(b.tag) + '</small></span>';
  }).join('') + '</div>' + (l.rxNote ? '<p class="snote">' + esc(l.rxNote) + '</p>' : '') + '</div>';
};
RT.tx = function (l) {
  return '<div class="strip"><div class="slab">将发出</div>' + l.tx.map(function (x) {
    return '<div class="tx"><span class="ms">+' + x.delay + ' ms</span><code>' + esc(x.data) + '</code><span class="from">由 ' + esc(x.from) + '</span></div>';
  }).join('') + '</div>';
};
RT.table = function (l) {
  if (!l.table) return '';
  return '<table class="cmp"><thead><tr>' + l.table.head.map(function (h, i) {
    return '<th' + (i ? ' class="hex"' : '') + '>' + esc(h) + '</th>';
  }).join('') + '</tr></thead><tbody>' + l.table.rows.map(function (row) {
    return '<tr>' + row.map(function (c, i) {
      var cls = c === '中' ? 'yes' : (c === '不中' ? 'no' : '');
      return '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(c) + '</td>';
    }).join('') + '</tr>';
  }).join('') + '</tbody></table>';
};
RT.block = function (l) {
  return '<p class="tuttext">' + esc(l.text) + '</p>' + RT.table(l) +
    '<div class="recipe">' + esc(RT.recipe(l)) + '</div>' + RT.strip(l) + RT.tx(l);
};

RT.fill = function (l, part) {
  var rule = l.rule;
  var all = !part || part === 'all';
  if (all || part === 'match') {
    $('dName').value = rule.name;
    $('dKind').value = rule.kind;
    $('dFormat').value = rule.format;
    $('dMatch').value = rule.match || 'prefix';
    $('dPattern').value = rule.pattern;
    $('dCase').checked = !!rule.ignoreCase;
    $('dKind').dispatchEvent(new Event('change'));
  }
  if (all || part === 'reply') {
    $('dLines').innerHTML = rule.replies.map(replyLine).join('');
    renumber();
    $('dOn').checked = true;
  }
};
RT.hot = function (part) {
  document.querySelectorAll('.ruleform .hot').forEach(function (n) { n.classList.remove('hot'); });
  if (part === 'match') {
    ['dName', 'dKind', 'dFormat', 'dMatch', 'dPattern'].forEach(function (id) {
      var el = $(id);
      if (!el) return;
      var row = el.closest('.row');
      if (row && row.style.display !== 'none') row.classList.add('hot');
    });
    var caseRow = $('dCaseRow');
    if (caseRow && caseRow.style.display !== 'none') caseRow.classList.add('hot');
  }
  if (part === 'reply') {
    var sub = document.querySelector('.ruleform .sub');
    var lines = document.querySelector('.ruleform .lines');
    if (sub) sub.classList.add('hot');
    if (lines) lines.classList.add('hot');
  }
};
RT.wroteLine = function (key) {
  if (RT.wrote !== key) return '';
  return '<p class="wrote">已写入左边，点「保存」才会出现在规则列表里。</p>';
};

RT.mount = function () {
  var body = $('dlgBody');
  var form = document.createElement('div');
  form.className = 'ruleform';
  while (body.firstChild) form.appendChild(body.firstChild);
  body.classList.add('split');
  body.appendChild(form);
  var rail = document.createElement('aside');
  rail.id = 'rail';
  rail.className = 'rail';
  body.appendChild(rail);
  document.querySelector('.dialog').classList.add('wide');
  rail.onclick = function (e) {
    var t = e.target.closest('[data-rt]');
    if (!t) return;
    RT.onClick(t.dataset.rt, t.dataset.id);
  };
  RT.paint();
};

var baseEditRule = editRule;
editRule = function (rule) {
  baseEditRule(rule);
  RT.mount();
};
var baseCloseDialog = closeDialog;
closeDialog = function () {
  var d = document.querySelector('.dialog');
  if (d) d.classList.remove('wide');
  var b = $('dlgBody');
  if (b) b.classList.remove('split');
  baseCloseDialog();
};
</script>
<script>
/* 版 A · 课表：点一课就在列表里展开，对照左边的空表单。 */
RT.open = 'wild';
RT.paint = function () {
  var html = '<div class="railhead"><b>教程</b><span>模板四课，正则三课。点开一课，可填进左边。</span></div><div class="rscroll">';
  RT.groups.forEach(function (g) {
    html += '<div class="glab">' + g.label + '</div>';
    RT.lessons.forEach(function (l) {
      if (l.group !== g.id) return;
      var on = RT.open === l.id;
      html += '<button type="button" class="lrow' + (on ? ' on' : '') + '" data-rt="open" data-id="' + l.id + '">' +
        '<span class="ti"><span class="no">' + RT.no(l) + '</span><span>' + esc(l.title) + '</span></span>' +
        '<span class="br">' + esc(l.brief) + '</span></button>';
      if (!on) return;
      html += '<div class="lbody">' + RT.block(l) +
        '<div class="acts"><button type="button" class="btn sm pri" data-rt="fill" data-id="' + l.id + '">填入编辑器</button></div>' +
        RT.wroteLine(l.id) + '</div>';
    });
  });
  $('rail').innerHTML = html + '</div>';
};
RT.onClick = function (act, id) {
  if (act === 'open') { RT.open = RT.open === id ? '' : id; RT.paint(); return; }
  if (act === 'fill') { RT.fill(RT.byId(id)); RT.wrote = id; RT.hot(''); RT.paint(); }
};
setTab('reply');
editRule(null);
</script>
</body>
</html>
