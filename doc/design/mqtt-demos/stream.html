<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MQTT 调试 · 报文流</title>
<style>
/*
  Assumptions
  - 视觉锁在 design.md 白底经典 + option-a 浅色 --mqtt #b86b0a。
  - 演示 Broker：broker.local:1883，MQTT 5.0，Client ID ddt-desktop-01。
  - 本文件只演示 MQTT 调试区骨架，不进入 Flutter，不改 option-a。
  - MQTT 5 User Properties / 共享订阅 / 主题别名不进本稿。
  form 来自内容：Topic 是表里的一列，过滤条决定看见哪条路径。
*/
:root{
  --win:#e9edf1;--panel:#f7f8fa;--field:#fff;--line:#c5ced7;--line2:#dfe4e9;
  --text:#1f2933;--muted:#56616e;--accent:#1769c2;--accent-ink:#fff;--hover:#e3ebf5;
  --log-bg:#fff;--log-prompt:#6b7480;--log-rx:#1b2630;--log-tx:#1461b8;--log-sys:#9a5a00;--mark:#ffe28a;
  --on:#1f9d55;--off:#c8392f;--idle:#b9c1ca;--mqtt:#b86b0a;
  --sans:"Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body,#app{height:100%}
body{font:14px/1.45 var(--sans);color:var(--text);background:var(--win);overflow:hidden;text-wrap:pretty}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;min-width:1180px;display:grid;grid-template-rows:34px minmax(0,1fr) 30px}
.menubar{display:flex;align-items:center;gap:2px;padding:0 0 0 8px;background:var(--panel);border-bottom:1px solid var(--line);user-select:none}
.brand{font-weight:600;padding:0 10px 0 4px}
.dir{font-size:12px;color:var(--muted);margin-right:8px}
.menu>button{border:0;background:none;height:28px;padding:0 12px;border-radius:4px}
.menu>button:hover{background:var(--hover)}
.spacer{flex:1}
.iconbtn{border:1px solid transparent;background:none;height:26px;padding:0 10px;border-radius:4px;font-size:13px;color:var(--muted)}
.iconbtn:hover,.iconbtn.on{border-color:var(--line);color:var(--text);background:var(--field)}
.wins{display:flex;align-self:stretch;margin-left:8px}
.wins button{width:46px;border:0;border-radius:0;background:transparent}
.wins button:hover{background:var(--hover)}
.wins .close:hover{background:var(--off);color:#fff}
.body{min-height:0;display:grid;grid-template-rows:36px auto minmax(0,1fr) auto;padding:8px;gap:8px}
.tabs{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tab{min-width:158px;display:flex;align-items:center;gap:7px;padding:0 10px;border-right:1px solid var(--line);color:var(--muted);cursor:pointer}
.tab.on{color:var(--text);background:var(--field);box-shadow:inset 0 -2px var(--accent)}
.kind{font:10px var(--mono);font-weight:700;color:var(--mqtt);border:1px solid var(--mqtt);border-radius:3px;padding:1px 4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:0 0 auto}
.dot.on{background:var(--on)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.host{font:13px var(--mono);font-weight:600}
.note,.meta{font-size:12px;color:var(--muted)}
.inp,select{height:26px;border:1px solid var(--line);border-radius:4px;background:var(--field);padding:0 6px;outline:none;min-width:0}
.inp:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
.btn{height:28px;border:1px solid var(--line);border-radius:4px;background:var(--field);padding:0 12px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{height:24px;padding:0 8px;font-size:13px}
.btn.danger{color:var(--off)}
.lamp{width:12px;height:12px;border-radius:50%;background:var(--off);display:inline-block}
.lamp.on{background:var(--on)}
.check{display:flex;align-items:center;gap:6px;font-size:12px}
.more{border:0;background:none;color:var(--accent);font-size:12px;padding:0}
.more:hover{text-decoration:underline}
.settings{display:none;width:100%;border-top:1px solid var(--line2);padding-top:8px;margin-top:4px}
.settings.show{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 16px}
.field{display:flex;flex-direction:column;gap:3px}
.field span{font-size:12px;color:var(--muted)}
.field .inp, .field select{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:1px solid var(--line);border-radius:4px;background:var(--field);font:12px var(--mono)}
.chip button{border:0;background:none;color:var(--muted);height:18px;padding:0 2px;border-radius:3px}
.chip button:hover{color:var(--off);background:var(--hover)}
.addsub{display:flex;gap:6px;align-items:center}
.stage{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--log-bg)}
.table-wrap{min-height:0;overflow:auto}
table{width:100%;border-collapse:collapse;font:13px var(--mono)}
th{position:sticky;top:0;background:var(--panel);color:var(--muted);font:12px var(--sans);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr{cursor:pointer}
tr:hover td{background:var(--hover)}
tr.on td{background:var(--mark)}
td.dir.rx{color:var(--log-rx)}
td.dir.tx{color:var(--log-tx)}
td.topic{color:var(--mqtt)}
td.payload{max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--log-rx)}
tr.tx td.payload{color:var(--log-tx)}
.expand{border-top:1px solid var(--line);background:var(--panel);display:none;grid-template-columns:minmax(0,1fr) 220px;min-height:140px}
.expand.show{display:grid}
.views{display:flex;border-bottom:1px solid var(--line2)}
.views button{height:32px;border:0;background:transparent;padding:0 14px;color:var(--muted);font-size:12px}
.views button.on{color:var(--text);font-weight:600;box-shadow:inset 0 -2px var(--accent)}
.payload-view{padding:10px 12px;font:13px/1.55 var(--mono);background:var(--log-bg);white-space:pre-wrap;word-break:break-all;overflow:auto;min-height:0}
.facts{padding:10px 12px;font-size:12px;color:var(--muted);border-left:1px solid var(--line2);display:flex;flex-direction:column;gap:8px}
.facts div{display:flex;flex-direction:column;gap:2px}
.facts b{font:13px var(--mono);font-weight:600;color:var(--text)}
.dock{display:grid;grid-template-columns:minmax(0,1fr) 108px;grid-template-rows:32px 72px 28px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.dock-top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:1px solid var(--line2)}
.dock textarea{grid-column:1;grid-row:2;border:0;resize:none;padding:8px 10px;background:var(--field);font:14px/1.45 var(--mono);outline:none}
.sendside{grid-column:2;grid-row:2;border-left:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px}
.sendfoot{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 10px;border-top:1px solid var(--line2);font:12px var(--mono);color:var(--muted)}
.status{display:flex;align-items:center;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.status>span{padding:0 12px;border-right:1px solid var(--line2);height:100%;display:flex;align-items:center;gap:6px}
.status b{color:var(--text);font:600 12px var(--mono)}
.status .last{margin-left:auto;border-right:0;border-left:1px solid var(--line2)}
.toast{position:fixed;left:50%;bottom:42px;transform:translateX(-50%);z-index:30;background:var(--text);color:var(--win);padding:7px 14px;border-radius:5px}
.toast.bad{background:var(--off);color:#fff}
.empty{padding:36px 16px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function stamp(ms) {
    var d = ms ? new Date(ms) : new Date();
    function p(n, len) { return String(n).padStart(len || 2, '0'); }
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + '.' + p(d.getMilliseconds(), 3);
  }
  function bytes(text) { return new TextEncoder().encode(String(text)).length; }
  function uid(prefix) { state.seq += 1; return prefix + state.seq; }
  function toHex(text) {
    return Array.from(new TextEncoder().encode(String(text))).map(function (b) {
      return b.toString(16).padStart(2, '0').toUpperCase();
    }).join(' ');
  }
  function pretty(text) {
    try { return JSON.stringify(JSON.parse(text), null, 2); } catch (e) { return text; }
  }

  var seed = Date.parse('2026-10-21T11:42:01');
  var state = {
    seq: 10,
    connected: true,
    settingsOpen: false,
    selectedId: 'm2',
    view: 'json',
    filter: '',
    toast: null,
    config: {
      host: 'broker.local', port: 1883, version: '5.0', clientId: 'ddt-desktop-01',
      username: 'device-lab', password: '••••••••', tls: false, caFile: '未选择',
      clientCert: '未选择', keepAlive: 30, cleanStart: true, sessionExpiry: 3600,
      autoReconnect: true, willTopic: 'device/status', willPayload: 'offline',
      willQos: 1, willRetain: true
    },
    pub: { topic: 'device/demo/command', qos: 1, retain: false, payload: '{"led":true}' },
    subs: [
      { id: 's1', topic: 'device/+/telemetry', qos: 1, retain: false },
      { id: 's2', topic: 'device/status', qos: 1, retain: true }
    ],
    draftSub: { topic: 'device/ack', qos: 1 },
    messages: [
      { id: 'm1', dir: 'rx', time: stamp(seed + 102), topic: 'device/status', qos: 1, retain: true, payload: 'online' },
      { id: 'm2', dir: 'rx', time: stamp(seed + 1340), topic: 'device/room1/telemetry', qos: 1, retain: false, payload: '{"temp":23.4,"hum":51.8}' },
      { id: 'm3', dir: 'tx', time: stamp(seed + 7012), topic: 'device/demo/command', qos: 1, retain: false, payload: '{"led":true}' },
      { id: 'm4', dir: 'rx', time: stamp(seed + 7231), topic: 'device/ack', qos: 1, retain: false, payload: '{"ok":true}' }
    ],
    rxCount: 0, txCount: 13
  };
  state.rxCount = bytes('online') + bytes('{"temp":23.4,"hum":51.8}') + bytes('{"ok":true}');

  function toast(text, bad) {
    state.toast = { text: text, bad: !!bad };
    render();
    setTimeout(function () { state.toast = null; render(); }, 1900);
  }
  function push(msg) {
    state.messages.push(msg);
    if (msg.dir === 'rx') state.rxCount += bytes(msg.payload);
    if (msg.dir === 'tx') state.txCount += bytes(msg.payload);
  }
  function requireOpen(action) {
    if (state.connected) return true;
    toast('MQTT 未连接，' + action + '已拦截', true);
    return false;
  }
  function connect() {
    state.connected = true;
    push({ id: uid('m'), dir: 'rx', time: stamp(), topic: 'device/status', qos: 1, retain: true, payload: 'online' });
    push({ id: uid('m'), dir: 'rx', time: stamp(), topic: 'device/room1/telemetry', qos: 1, retain: false, payload: '{"temp":23.4,"hum":51.8}' });
    toast('已连接到 ' + state.config.host);
    render();
  }
  function disconnect() {
    state.connected = false;
    toast('已断开连接');
    render();
  }
  function publish(topic, qos, retain, payload) {
    if (!requireOpen('发布')) return;
    if (!String(topic).trim()) { toast('请填写 Topic', true); return; }
    if (!String(payload).length) { toast('请填写 Payload', true); return; }
    var msg = { id: uid('m'), dir: 'tx', time: stamp(), topic: topic, qos: Number(qos), retain: !!retain, payload: payload };
    push(msg);
    state.selectedId = msg.id;
    state.pub.payload = payload;
    toast('已发布 ' + topic);
    render();
    setTimeout(function () {
      if (!state.connected) return;
      var ack = { id: uid('m'), dir: 'rx', time: stamp(), topic: 'device/ack', qos: 1, retain: false, payload: '{"ok":true,"echo":' + JSON.stringify(payload) + '}' };
      push(ack);
      render();
    }, 220);
  }
  function subscribe() {
    if (!requireOpen('订阅')) return;
    var topic = String(state.draftSub.topic || '').trim();
    if (!topic) { toast('请填写订阅 Topic', true); return; }
    if (state.subs.some(function (s) { return s.topic === topic; })) { toast('已经订阅过该主题', true); return; }
    state.subs.push({ id: uid('s'), topic: topic, qos: Number(state.draftSub.qos), retain: false });
    state.draftSub.topic = '';
    toast('已订阅 ' + topic);
    render();
  }
  function unsubscribe(id) {
    var sub = state.subs.find(function (s) { return s.id === id; });
    if (!sub) return;
    if (!requireOpen('退订')) return;
    state.subs = state.subs.filter(function (s) { return s.id !== id; });
    toast('已退订 ' + sub.topic);
    render();
  }
  function visibleMessages() {
    var q = state.filter.trim().toLowerCase();
    if (!q) return state.messages;
    return state.messages.filter(function (m) {
      return m.topic.toLowerCase().indexOf(q) >= 0 || m.payload.toLowerCase().indexOf(q) >= 0;
    });
  }
  function selectedMessage() {
    return state.messages.find(function (m) { return m.id === state.selectedId; }) || null;
  }

  function render() {
    var c = state.config;
    var vis = visibleMessages();
    var sel = selectedMessage();
    var viewText = !sel ? '' : state.view === 'hex' ? toHex(sel.payload) : state.view === 'json' ? pretty(sel.payload) : sel.payload;
    var rows = vis.length ? vis.map(function (m, i) {
      return '<tr class="' + m.dir + (m.id === state.selectedId ? ' on' : '') + '" data-act="select" data-id="' + m.id + '">' +
        '<td>' + (i + 1) + '</td><td>' + esc(m.time) + '</td>' +
        '<td class="dir ' + m.dir + '">' + (m.dir === 'rx' ? 'RECV' : 'PUB') + '</td>' +
        '<td class="topic">' + esc(m.topic) + '</td>' +
        '<td>' + m.qos + '</td><td>' + (m.retain ? '是' : '') + '</td>' +
        '<td>' + bytes(m.payload) + '</td>' +
        '<td class="payload">' + esc(m.payload) + '</td></tr>';
    }).join('') : '<tr><td colspan="8"><div class="empty">没有匹配的报文。改一下 Topic 过滤，或先订阅。</div></td></tr>';
    var chips = state.subs.map(function (s) {
      return '<span class="chip">' + esc(s.topic) + ' · QoS ' + s.qos + (s.retain ? ' · Retain' : '') +
        '<button type="button" data-act="unsub" data-id="' + s.id + '" title="退订">×</button></span>';
    }).join('');
    document.getElementById('app').innerHTML =
      '<div class="app"><header class="menubar"><span class="brand">设备调试工具</span><span class="dir">MQTT 调试 · 报文流</span>' +
      '<div class="menu"><button type="button">文件</button></div><div class="menu"><button type="button">设置</button></div>' +
      '<div class="menu"><button type="button">帮助</button></div><span class="spacer"></span>' +
      '<button class="iconbtn" type="button">精简模式</button><button class="iconbtn on" type="button">工具面板</button>' +
      '<div class="wins"><button type="button">─</button><button type="button">□</button><button class="close" type="button">×</button></div></header>' +
      '<main class="body"><div class="tabs">' +
      '<div class="tab on"><span class="dot ' + (state.connected ? 'on' : '') + '"></span><span class="kind">MQTT</span>车间 Broker</div>' +
      '<div class="tab" data-act="other-tab"><span class="dot"></span><span class="kind" style="color:#1f9d55;border-color:#1f9d55">SERIAL</span>COM3</div>' +
      '</div><div class="toolbar">' +
      '<span class="host">' + esc(c.host) + ':' + c.port + '</span><span class="note">MQTT ' + esc(c.version) + ' · ' + esc(c.clientId) + '</span>' +
      '<button class="btn ' + (state.connected ? '' : 'pri') + '" data-act="toggle"><i class="lamp ' + (state.connected ? 'on' : '') + '"></i> ' + (state.connected ? '断开' : '连接') + '</button>' +
      '<button class="more" data-act="toggle-settings">' + (state.settingsOpen ? '收起连接设置' : '展开连接设置') + '</button>' +
      '<span class="spacer"></span>' +
      '<input class="inp" data-filter placeholder="过滤 Topic / Payload" value="' + esc(state.filter) + '" style="width:220px">' +
      '<button class="btn sm" data-act="clear">清空表</button>' +
      '<div class="settings ' + (state.settingsOpen ? 'show' : '') + '">' +
      '<label class="field"><span>版本</span><select data-cfg="version"><option' + (c.version === '3.1.1' ? ' selected' : '') + '>3.1.1</option><option' + (c.version === '5.0' ? ' selected' : '') + '>5.0</option></select></label>' +
      '<label class="field"><span>用户名</span><input class="inp" data-cfg="username" value="' + esc(c.username) + '"></label>' +
      '<label class="field"><span>密码</span><input class="inp" data-cfg="password" type="password" value="' + esc(c.password) + '"></label>' +
      '<label class="field"><span>Keep Alive</span><input class="inp" data-cfg="keepAlive" value="' + esc(c.keepAlive) + '"></label>' +
      '<label class="field"><span>Session Expiry</span><input class="inp" data-cfg="sessionExpiry" value="' + esc(c.sessionExpiry) + '"></label>' +
      '<label class="field"><span>CA 证书</span><input class="inp" data-cfg="caFile" value="' + esc(c.caFile) + '"></label>' +
      '<label class="field"><span>客户端证书</span><input class="inp" data-cfg="clientCert" value="' + esc(c.clientCert) + '"></label>' +
      '<label class="field"><span>遗嘱 Topic</span><input class="inp" data-cfg="willTopic" value="' + esc(c.willTopic) + '"></label>' +
      '<label class="field"><span>遗嘱 Payload</span><input class="inp" data-cfg="willPayload" value="' + esc(c.willPayload) + '"></label>' +
      '<label class="field"><span>遗嘱 QoS</span><select data-cfg="willQos"><option' + (c.willQos === 0 ? ' selected' : '') + '>0</option><option' + (c.willQos === 1 ? ' selected' : '') + '>1</option><option' + (c.willQos === 2 ? ' selected' : '') + '>2</option></select></label>' +
      '<label class="check"><input type="checkbox" data-cfg="tls"' + (c.tls ? ' checked' : '') + '> 启用 TLS</label>' +
      '<label class="check"><input type="checkbox" data-cfg="cleanStart"' + (c.cleanStart ? ' checked' : '') + '> Clean Start</label>' +
      '<label class="check"><input type="checkbox" data-cfg="autoReconnect"' + (c.autoReconnect ? ' checked' : '') + '> 断线自动重连</label>' +
      '<label class="check"><input type="checkbox" data-cfg="willRetain"' + (c.willRetain ? ' checked' : '') + '> 遗嘱 Retain</label>' +
      '</div><div class="chips">' + chips +
      '<span class="addsub"><input class="inp" data-draft="topic" placeholder="订阅 Topic" value="' + esc(state.draftSub.topic) + '" style="width:180px">' +
      '<select data-draft="qos"><option' + (state.draftSub.qos === 0 ? ' selected' : '') + '>0</option><option' + (state.draftSub.qos === 1 ? ' selected' : '') + '>1</option><option' + (state.draftSub.qos === 2 ? ' selected' : '') + '>2</option></select>' +
      '<button class="btn sm pri" data-act="sub">订阅</button></span></div></div>' +
      '<section class="stage"><div class="table-wrap"><table><thead><tr><th>#</th><th>时间</th><th>方向</th><th>Topic</th><th>QoS</th><th>Retain</th><th>字节</th><th>Payload</th></tr></thead><tbody>' +
      rows + '</tbody></table></div>' +
      '<div class="expand ' + (sel ? 'show' : '') + '" id="payload-panel"><div><div class="views">' +
      '<button class="' + (state.view === 'raw' ? 'on' : '') + '" data-act="view" data-view="raw">原文</button>' +
      '<button class="' + (state.view === 'json' ? 'on' : '') + '" data-act="view" data-view="json">JSON</button>' +
      '<button class="' + (state.view === 'hex' ? 'on' : '') + '" data-act="view" data-view="hex">HEX</button></div>' +
      '<div class="payload-view" id="payload">' + esc(viewText) + '</div></div>' +
      '<div class="facts">' + (sel ? '<div>Topic<b>' + esc(sel.topic) + '</b></div><div>方向<b>' + (sel.dir === 'rx' ? 'RECV' : 'PUB') + '</b></div><div>QoS<b>' + sel.qos + '</b></div><div>Retain<b>' + (sel.retain ? '是' : '否') + '</b></div><div>字节<b>' + bytes(sel.payload) + '</b></div><div>时间<b>' + esc(sel.time) + '</b></div>' : '') + '</div></div></section>' +
      '<div class="dock"><div class="dock-top"><span class="note">发布坞</span><input class="inp" data-pub="topic" value="' + esc(state.pub.topic) + '" style="flex:1;font:12px var(--mono)">' +
      '<select data-pub="qos" style="width:64px"><option' + (state.pub.qos === 0 ? ' selected' : '') + '>0</option><option' + (state.pub.qos === 1 ? ' selected' : '') + '>1</option><option' + (state.pub.qos === 2 ? ' selected' : '') + '>2</option></select>' +
      '<label class="check"><input type="checkbox" data-pub="retain"' + (state.pub.retain ? ' checked' : '') + '> Retain</label></div>' +
      '<textarea data-pub="payload">' + esc(state.pub.payload) + '</textarea>' +
      '<div class="sendside"><button class="btn pri" data-act="pub">发布</button><button class="btn" data-act="clear-tx">清除</button></div>' +
      '<div class="sendfoot"><span>实发 ' + bytes(state.pub.payload) + ' 字节</span><span>' + esc(state.pub.topic) + ' · QoS ' + state.pub.qos + (state.pub.retain ? ' · Retain' : '') + '</span><span class="spacer"></span><span>Ctrl+Enter</span></div></div>' +
      '</main><footer class="status"><span><i class="lamp ' + (state.connected ? 'on' : '') + '" style="width:9px;height:9px"></i><b>' +
      esc(c.host) + ':' + c.port + ' ' + (state.connected ? 'OPENED' : 'CLOSED') + ', MQTT ' + esc(c.version) + ', ' + esc(c.clientId) + '</b></span>' +
      '<span>RX <b>' + state.rxCount + '</b></span><span>TX <b>' + state.txCount + '</b></span><span>订阅 ' + state.subs.length + '</span>' +
      '<span class="last">' + vis.length + ' / ' + state.messages.length + ' 条</span></footer></div>' +
      (state.toast ? '<div class="toast' + (state.toast.bad ? ' bad' : '') + '">' + esc(state.toast.text) + '</div>' : '');
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'toggle') { state.connected ? disconnect() : connect(); return; }
    if (act === 'toggle-settings') { state.settingsOpen = !state.settingsOpen; render(); return; }
    if (act === 'select') { state.selectedId = t.getAttribute('data-id'); render(); return; }
    if (act === 'view') { state.view = t.getAttribute('data-view'); render(); return; }
    if (act === 'sub') { subscribe(); return; }
    if (act === 'unsub') { unsubscribe(t.getAttribute('data-id')); return; }
    if (act === 'pub') { publish(state.pub.topic, state.pub.qos, state.pub.retain, state.pub.payload); return; }
    if (act === 'clear-tx') { state.pub.payload = ''; render(); return; }
    if (act === 'clear') { state.messages = []; state.selectedId = null; render(); return; }
    if (act === 'other-tab') toast('本方向稿只演示 MQTT');
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.hasAttribute('data-cfg')) {
      var key = el.getAttribute('data-cfg');
      state.config[key] = el.type === 'checkbox' ? el.checked : (key === 'willQos' ? Number(el.value) : el.value);
      return;
    }
    if (el.hasAttribute('data-pub')) {
      var pk = el.getAttribute('data-pub');
      state.pub[pk] = el.type === 'checkbox' ? el.checked : (pk === 'qos' ? Number(el.value) : el.value);
      if (pk !== 'payload') render();
      return;
    }
    if (el.hasAttribute('data-draft')) state.draftSub[el.getAttribute('data-draft')] = el.getAttribute('data-draft') === 'qos' ? Number(el.value) : el.value;
  });
  document.addEventListener('input', function (e) {
    if (e.target.hasAttribute('data-filter')) {
      state.filter = e.target.value;
      render();
      var box = document.querySelector('[data-filter]');
      if (box) { box.focus(); box.setSelectionRange(state.filter.length, state.filter.length); }
      return;
    }
    if (e.target.getAttribute('data-pub') === 'payload') state.pub.payload = e.target.value;
    if (e.target.getAttribute('data-draft') === 'topic') state.draftSub.topic = e.target.value;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      publish(state.pub.topic, state.pub.qos, state.pub.retain, state.pub.payload);
    }
  });

  window.MqttDemo = { state: state, render: render, connect: connect, disconnect: disconnect, publish: publish };
  render();
})();
</script>
</body>
</html>
