<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MQTT 调试 · 会话继承</title>
<style>
/*
  Assumptions
    - 视觉锁在 design.md 白底经典 + option-a 浅色 --mqtt #b86b0a。
    - 左栏只留连接，整栏不折叠，连接设置始终展开。
    - 右栏页签：订阅 | 快捷发布 | 历史发送 | 脚本。脚本页用竖线隔开。
    - 订阅和快捷发布都从工具条「新增」进对话框。快捷发布页只留发布主题。行上是主操作，删除在右键（稿里用按钮代替右键）。
    - 历史发送只记录「发布」按钮。点时间重发，点「填入」放回发布框。
    - 发布主题在快捷发布页顶部，点「填入」只写发送区 Topic。
  form 来自内容：连接参数留在左栏，订/发/脚本是同一条会话的三种动作，所以并进右栏页签。
*/
:root{
  --win:#e9edf1;--panel:#f7f8fa;--field:#fff;--line:#c5ced7;--line2:#dfe4e9;
  --text:#1f2933;--muted:#56616e;--accent:#1769c2;--accent-ink:#fff;--hover:#e3ebf5;
  --log-bg:#fff;--log-prompt:#6b7480;--log-rx:#1b2630;--log-tx:#1461b8;--log-sys:#9a5a00;--mark:#ffe28a;
  --on:#1f9d55;--off:#c8392f;--idle:#b9c1ca;--mqtt:#b86b0a;
  --sans:"Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body,#app{height:100%}
body{font:14px/1.45 var(--sans);color:var(--text);background:var(--win);overflow:hidden;text-wrap:pretty}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;min-width:1180px;display:grid;grid-template-rows:34px minmax(0,1fr) 30px}
.menubar{display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);user-select:none}
.brand{font-weight:600;padding:0 10px 0 4px}
.dir{font-size:12px;color:var(--muted);margin-right:8px}
.menu>button{border:0;background:none;height:28px;padding:0 12px;border-radius:4px}
.menu>button:hover{background:var(--hover)}
.spacer{flex:1}
.wins{display:flex;align-self:stretch}
.wins button{width:46px;border:0;border-radius:0;background:transparent}
.wins button:hover{background:var(--hover)}
.wins .close:hover{background:var(--off);color:#fff}
.body{min-height:0;display:grid;grid-template-rows:36px minmax(0,1fr);padding:8px;gap:8px}
.tabs{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tab{min-width:158px;display:flex;align-items:center;gap:7px;padding:0 10px;border-right:1px solid var(--line);color:var(--muted)}
.tab.on{color:var(--text);background:var(--field);box-shadow:inset 0 -2px var(--accent)}
.kind{font:10px var(--mono);font-weight:700;color:var(--mqtt);border:1px solid var(--mqtt);border-radius:3px;padding:1px 4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:0 0 auto}
.dot.on{background:var(--on)}
.grid{min-height:0;display:grid;grid-template-columns:272px minmax(0,1fr) 352px;gap:8px}
.side{min-height:0;overflow:auto}
.group{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:7px 12px 8px}
.legend{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:8px 0 6px}
.form{display:grid;grid-template-columns:72px minmax(0,1fr);gap:5px 8px;align-items:center}
.form label,.note,.sub-meta,.sec{font-size:12px;color:var(--muted)}
.sec{font-weight:600;margin:8px 0 4px}
.inp,select{height:26px;border:1px solid var(--line);border-radius:4px;background:var(--field);padding:0 6px;outline:none;min-width:0;width:100%}
.inp:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
.btn{height:28px;border:1px solid var(--line);border-radius:4px;background:var(--field);padding:0 12px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{height:24px;padding:0 8px;font-size:13px}
.btn.danger{color:var(--off)}
.openbtn{width:100%;height:32px;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.lamp{width:12px;height:12px;border-radius:50%;background:var(--off)}
.lamp.on{background:var(--on)}
.check{display:flex;align-items:center;gap:6px;font-size:12px;margin:5px 0}
.more{border:0;background:none;color:var(--accent);font-size:12px;padding:0;margin:6px 0 2px}
.settings{display:block;border-top:1px solid var(--line2);padding-top:4px;margin-top:6px}
.center{min-height:0;display:flex;flex-direction:column;gap:8px}
.logbox{min-height:0;flex:1;border:1px solid var(--line);border-radius:6px;background:var(--log-bg);display:grid;grid-template-rows:36px minmax(0,1fr);overflow:hidden}
.loghead{display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.loghead b{font-weight:600}
.loghead .meta{flex:1;font:12px var(--mono);color:var(--muted)}
.search{width:150px;height:24px}
.log{overflow:auto;padding:10px 12px;font:14px/1.6 var(--mono)}
.line .p{color:var(--log-prompt)}
.line.rx .body{color:var(--log-rx)}
.line.tx .body{color:var(--log-tx)}
.line.sys{color:var(--log-sys)}
.dock{height:312px;flex:0 0 auto;border:1px solid var(--line);border-radius:6px;background:var(--panel);display:grid;grid-template-rows:36px minmax(0,1fr);overflow:hidden}
.dockhead{display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line)}
.dockhead b{font-size:13px}
.dockhead .grow{flex:1;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dockbody{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.dockbody pre{margin:0;padding:8px 10px;overflow:auto;font:13px/1.55 var(--mono);background:var(--log-bg);white-space:pre}
.dockbody .run{border-left:1px solid var(--line);overflow:auto;padding:8px 10px;font:12px/1.55 var(--mono);color:var(--muted)}
.compose{border:1px solid var(--line);border-radius:6px;background:var(--panel);display:grid;grid-template-columns:minmax(0,1fr) 120px;grid-template-rows:32px minmax(0,1fr) 28px;overflow:hidden}
.compose-top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:1px solid var(--line2)}
.compose-top .inp{height:24px;font:12px var(--mono)}
.compose textarea{border:0;resize:none;height:72px;padding:8px 10px;background:var(--field);font:15px/1.5 var(--mono);outline:none}
.sendside{border-left:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px}
.sendbtn{flex:1;font-size:15px}
.sendfoot{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 10px;border-top:1px solid var(--line2);font:12px var(--mono);color:var(--muted)}
.sendfoot .grow{flex:1}
.tools{min-height:0;border:1px solid var(--line);border-radius:6px;background:var(--panel);display:grid;grid-template-rows:38px minmax(0,1fr);overflow:hidden}
.tooltabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.tooltabs button{flex:1;border:0;background:none;font-size:12px;color:var(--muted)}
.tooltabs button.on{color:var(--text);font-weight:600;box-shadow:inset 0 -2px var(--accent)}
.tooltabs .rule{width:1px;margin:10px 4px;background:var(--line);flex:0 0 auto}
.tooltabs .script{flex:0 0 auto;padding:0 14px}
.tool-body{min-height:0;overflow:auto}
.block{padding:8px 10px;border-bottom:1px solid var(--line2)}
.block .cap{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;display:flex;align-items:center}
.block .cap span{margin-left:auto;font-weight:400}
.sub,.ptopic{padding:6px 0;border-bottom:1px solid var(--line2);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center}
.ptopic.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ptopic .nm{font-size:13px;font-weight:600}
.sub-topic{font:12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 52px auto;gap:6px;margin-top:6px}
.addrow.topics{grid-template-columns:72px minmax(0,1fr) auto}
.toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--muted)}
.toolbar .grow{flex:1}
.it{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line2)}
.it .nm{font-weight:600}
.it .dt{font:12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.key{font:12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.explain{padding:10px 12px;font-size:12px;color:var(--muted);line-height:1.5}
.status{display:flex;align-items:center;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.status>span{padding:0 12px;border-right:1px solid var(--line2);height:100%;display:flex;align-items:center;gap:6px}
.status b{color:var(--text);font:600 12px var(--mono)}
.status .last{margin-left:auto;border-right:0;border-left:1px solid var(--line2)}
.toast{position:fixed;left:50%;bottom:42px;transform:translateX(-50%);z-index:30;background:var(--text);color:var(--win);padding:7px 14px;border-radius:5px}
.toast.bad{background:var(--off);color:#fff}
.mask{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.38);display:grid;place-items:center;padding:20px}
.dialog{width:min(640px,100%);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 16px 48px rgba(0,0,0,.25)}
.dialog h3{padding:14px 18px;border-bottom:1px solid var(--line2);font-size:15px}
.dialog .body{padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.dialog .row{display:grid;grid-template-columns:148px minmax(0,1fr);gap:10px;align-items:center}
.dialog .row>label{font-size:13px;color:var(--muted)}
.dialog .pair{display:grid;grid-template-columns:88px 1fr;gap:8px}
.dialog .err{color:var(--off);font-size:13px;min-height:18px}
.dialog .foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line2)}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var ports = { mqtt: 1883, mqtts: 8883, ws: 8083, wss: 8084 };
  function esc(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function bytes(text) { return new TextEncoder().encode(String(text)).length; }
  function uid(prefix) { state.seq += 1; return prefix + state.seq; }
  var state = {
    seq: 10, connected: true, tool: 'sub', dock: true,
    search: '', toast: null, dialog: null,
    config: {
      scheme: 'mqtt', host: 'broker.local', port: 1883, path: '', version: '5.0',
      clientId: 'ddt-desktop-01', username: 'device-lab', password: '••••••••',
      keepAlive: 30, cleanStart: true, sessionExpiry: 3600, autoReconnect: true,
      willTopic: 'device/status', willPayload: 'offline', willQos: 1, willRetain: true
    },
    pub: { topic: 'device/demo/command', qos: 1, retain: false, payload: '{"led":true}' },
    pubTopics: [
      { id: 't1', name: '指示灯', topic: 'device/demo/command' },
      { id: 't2', name: '读遥测', topic: 'device/room1/command' }
    ],
    draftPub: { name: '', topic: '' },
    subs: [
      { id: 's1', topic: 'device/+/telemetry', qos: 1 },
      { id: 's2', topic: 'device/status', qos: 1 }
    ],
    draftSub: { topic: '', qos: 0 },
    quick: [
      { id: 'q1', name: '打开指示灯', key: 'F1', data: '{"led":true}', inherit: true, topic: '', qos: 1, retain: false },
      { id: 'q3', name: '读遥测', key: 'F3', data: '{"cmd":"read"}', inherit: false, topic: 'device/room1/command', qos: 1, retain: false }
    ],
    history: [
      { topic: 'device/demo/command', payload: '{"led":true}', qos: 1, retain: false, time: '09:12:04' }
    ],
    script: { name: 'print_message.lua', code: 'function on_message(msg)\n  log(msg.topic, msg.payload)\nend\n' },
    messages: [
      { dir: 'sys', payload: '已连接 mqtt://broker.local:1883，Client ID ddt-desktop-01' },
      { dir: 'rx', topic: 'device/status', qos: 1, retain: true, payload: 'online' },
      { dir: 'tx', topic: 'device/demo/command', qos: 1, retain: false, payload: '{"led":true}' }
    ]
  };
  function toast(text, bad) {
    state.toast = { text: text, bad: !!bad };
    render();
    setTimeout(function () { state.toast = null; render(); }, 1600);
  }
  function requireOpen(action) {
    if (state.connected) return true;
    toast('MQTT 未连接，' + action + '已拦截', true);
    return false;
  }
  function endpoint() {
    var c = state.config;
    var path = (c.scheme === 'ws' || c.scheme === 'wss') ? (c.path || '/') : '';
    return c.scheme + '://' + c.host + ':' + c.port + path;
  }
  function publish(topic, qos, retain, payload, record) {
    if (!requireOpen('发布')) return;
    topic = String(topic).trim();
    if (!topic) { toast('请填写发布 Topic', true); return; }
    if (!String(payload).length) { toast('Payload 为空', true); return; }
    state.messages.push({ dir: 'tx', topic: topic, qos: qos, retain: retain, payload: payload });
    if (record) {
      var now = new Date();
      function pad(n) { return (n < 10 ? '0' : '') + n; }
      var entry = {
        topic: topic, payload: payload, qos: qos, retain: !!retain,
        time: pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds())
      };
      state.history = [entry].concat(state.history.filter(function (item) {
        return !(item.topic === entry.topic && item.payload === entry.payload && item.qos === entry.qos && item.retain === entry.retain);
      })).slice(0, 12);
    }
    toast('已发布 ' + topic);
    render();
  }
  function field(label, key, value, extra) {
    extra = extra || {};
    var ctrl = extra.select
      ? '<select data-cfg="' + key + '">' + extra.items.map(function (it) {
          return '<option' + (String(it) === String(value) ? ' selected' : '') + '>' + esc(it) + '</option>';
        }).join('') + '</select>'
      : '<input class="inp" data-cfg="' + key + '" value="' + esc(value) + '">';
    return '<label>' + esc(label) + '</label>' + ctrl;
  }
  function render() {
    var c = state.config;
    var secure = c.scheme === 'mqtts' || c.scheme === 'wss';
    var ws = c.scheme === 'ws' || c.scheme === 'wss';
    var lines = state.messages.map(function (m) {
      if (m.dir === 'sys') return '<div class="line sys"><span class="p"># </span>' + esc(m.payload) + '</div>';
      var tag = m.dir === 'rx' ? 'RECV' : 'PUB';
      return '<div class="line ' + m.dir + '"><div><span class="p"># ' + tag + ' [' + esc(m.topic) + '] QoS' + m.qos + (m.retain ? ' RETAIN' : '') + '&gt;</span></div><div class="body">' + esc(m.payload) + '</div></div>';
    }).join('');
    var subs = state.subs.map(function (s) {
      var on = s.active !== false;
      return '<div class="it" style="grid-template-columns:minmax(0,1fr) auto"><div><div class="nm">' + esc(s.topic) + '</div><div class="sub-meta">QoS ' + s.qos + '</div></div><button class="btn sm ' + (on ? 'danger' : 'pri') + '" data-act="toggle-sub" data-id="' + s.id + '">' + (on ? '退订' : '订阅') + '</button></div>';
    }).join('') || '<div class="explain">还没有订阅。点「新增」添加一条。</div>';
    var pubs = state.pubTopics.map(function (t) {
      return '<div class="it"><button class="btn sm" data-act="fill" data-id="' + t.id + '">填入</button><div><div class="nm">' + esc(t.name) + '</div><div class="sub-topic">' + esc(t.topic) + '</div></div></div>';
    }).join('') || '<div class="explain">还没有发布主题。点「新增」保存一条，再点「填入」写到发布框。</div>';
    var quick = state.quick.map(function (q) {
      var target = q.inherit ? ('继承 · ' + state.pub.topic + ' · QoS ' + state.pub.qos) : (q.topic + ' · QoS ' + q.qos);
      return '<div class="it"><button class="btn sm pri" data-act="quick" data-id="' + q.id + '">发布</button><div><div class="nm">' + esc(q.name) + (q.key ? ' <span class="key">' + esc(q.key) + '</span>' : '') + '</div><div class="dt">' + esc(q.data) + '</div><div class="sub-meta">' + esc(target) + '</div></div></div>';
    }).join('');
    var tool = '';
    if (state.tool === 'sub') {
      tool = '<div class="toolbar"><span class="grow">右侧切换订阅和退订。右键编辑或删除。</span><button class="btn sm" data-act="add-sub">新增</button></div>' + subs;
    } else if (state.tool === 'quick') {
      tool = '<div class="toolbar"><span class="grow">发布主题</span><button class="btn sm" data-act="add-topic">新增</button></div>' + pubs;
    } else if (state.tool === 'history') {
      var hist = state.history.map(function (h, i) {
        return '<div class="it"><button class="btn sm" data-act="resend" data-id="' + i + '">' + esc(h.time) + '</button><div><div class="nm">' + esc(h.payload) + '</div><div class="sub-meta">' + esc(h.topic) + ' · QoS ' + h.qos + (h.retain ? ' · Retain' : '') + ' <button class="more" data-act="fill-history" data-id="' + i + '">填入</button></div></div></div>';
      }).join('');
      tool = '<div class="toolbar"><span class="grow">只记录用「发布」按钮发出的报文。点时间重发，点「填入」放回发布框。</span><button class="btn sm" data-act="clear-history">清空</button></div>' +
        (hist || '<div class="explain">还没有发布记录。</div>');
    } else {
      tool = '<div class="toolbar"><span class="grow">已启用 1 / 1</span><button class="btn sm">新建</button></div>' +
        '<div class="it"><div class="nm">' + esc(state.script.name) + '</div><div class="sub-meta">on_message · 等待触发</div></div>' +
        '<div class="explain">on_message 在报文写入日志后运行。before_publish 经过发布框和快捷发布，返回 nil 则不发。</div>';
    }
    var dock = state.tool === 'script' && state.dock
      ? '<div class="dock"><div class="dockhead"><b>' + esc(state.script.name) + '</b><span class="grow">on_message · 已停用，仅手动运行</span><button class="btn sm pri" data-act="run">运行</button><button class="more" data-act="fold">收起</button></div><div class="dockbody"><pre>' + esc(state.script.code) + '</pre><div class="run">运行日志</div></div></div>'
      : '';
    var dlg = '';
    if (state.dialog) {
      var d = state.dialog;
      var body = '';
      var title = '新增快捷发布';
      var ok = '保存';
      if (d.kind === 'sub') {
        title = '订阅';
        ok = '订阅';
        body = '<div class="row"><label>Topic</label><input class="inp" id="dlgTopic" value="' + esc(d.topic) + '"></div>' +
          '<div class="row"><label>QoS</label><select id="dlgQos"><option' + (d.qos === 0 ? ' selected' : '') + '>0</option><option' + (d.qos === 1 ? ' selected' : '') + '>1</option><option' + (d.qos === 2 ? ' selected' : '') + '>2</option></select></div>';
      } else if (d.kind === 'topic') {
        title = '添加发布主题';
        body = '<div class="row"><label>名称</label><input class="inp" id="dlgName" value="' + esc(d.name) + '"></div>' +
          '<div class="row"><label>Topic</label><input class="inp" id="dlgTopic" value="' + esc(d.topic) + '"></div>';
      } else {
        title = d.id ? '编辑快捷发布' : '新增快捷发布';
        body = '<div class="row"><label>名称</label><input class="inp" id="dlgName" value="' + esc(d.name) + '"></div>' +
          '<div class="row"><label>Payload</label><input class="inp" id="dlgData" value="' + esc(d.data) + '"></div>' +
          '<div class="row"><label>快捷键</label><select id="dlgKey"><option value="">不绑定</option><option' + (d.key === 'F1' ? ' selected' : '') + '>F1</option><option' + (d.key === 'F3' ? ' selected' : '') + '>F3</option></select></div>' +
          '<label class="check"><input type="checkbox" id="dlgInherit"' + (d.inherit ? ' checked' : '') + '> 沿用发送区的 Topic、QoS、Retain</label>' +
          (d.inherit ? '' : '<div class="row"><label>Topic</label><input class="inp" id="dlgTopic" value="' + esc(d.topic) + '"></div><div class="row"><label>QoS / Retain</label><div class="pair"><select id="dlgQos"><option' + (d.qos === 0 ? ' selected' : '') + '>0</option><option' + (d.qos === 1 ? ' selected' : '') + '>1</option><option' + (d.qos === 2 ? ' selected' : '') + '>2</option></select><label class="check" style="margin:0"><input type="checkbox" id="dlgRetain"' + (d.retain ? ' checked' : '') + '> Retain</label></div></div>');
      }
      dlg = '<div class="mask" data-act="close-dlg"><div class="dialog" data-stop="1"><h3>' + title + '</h3><div class="body">' +
        body + '<div class="err" id="dlgErr"></div></div><div class="foot"><button class="btn" data-act="close-dlg">取消</button><button class="btn pri" data-act="save-dlg">' + ok + '</button></div></div></div>';
    }
    document.getElementById('app').innerHTML =
      '<div class="app"><header class="menubar"><span class="brand">设备调试工具</span><span class="dir">MQTT 调试</span>' +
      '<div class="menu"><button type="button">文件</button></div><div class="menu"><button type="button">设置</button></div><div class="menu"><button type="button">帮助</button></div><span class="spacer"></span>' +
      '<div class="wins"><button type="button">─</button><button type="button">□</button><button class="close" type="button">×</button></div></header>' +
      '<main class="body"><div class="tabs"><div class="tab on"><span class="dot on"></span><span class="kind">MQTT</span>车间 Broker</div></div>' +
      '<div class="grid"><aside class="side"><section class="group"><div class="legend" style="margin-top:0">MQTT 连接</div><div class="form">' +
      field('协议', 'scheme', c.scheme, { select: true, items: ['mqtt', 'mqtts', 'ws', 'wss'] }) +
      field('Broker', 'host', c.host) + field('端口', 'port', c.port) +
      (ws ? field('路径', 'path', c.path) : '') +
      '</div><button class="btn openbtn" data-act="toggle"><i class="lamp on"></i>断开</button>' +
      '<div class="settings"><div class="sec">会话</div><div class="form">' +
      field('版本', 'version', c.version, { select: true, items: ['3.1.1', '5.0'] }) +
      field('Client ID', 'clientId', c.clientId) + field('用户名', 'username', c.username) +
      field('Keep Alive', 'keepAlive', c.keepAlive) +
      (c.version === '5.0' ? field('Session Expiry', 'sessionExpiry', c.sessionExpiry) : '') +
      '</div><label class="check"><input type="checkbox" data-cfg="cleanStart"' + (c.cleanStart ? ' checked' : '') + '> Clean Start</label>' +
      '<label class="check"><input type="checkbox" data-cfg="autoReconnect"' + (c.autoReconnect ? ' checked' : '') + '> 断线自动重连</label>' +
      (secure ? '<div class="sec">TLS</div><div class="form">' + field('CA 证书', 'ca', '未选择') + field('客户端证书', 'cert', '未选择') + field('私钥', 'key', '未选择') + '</div>' : '') +
      '<div class="sec">遗嘱</div><div class="form">' + field('遗嘱 Topic', 'willTopic', c.willTopic) + field('遗嘱 Payload', 'willPayload', c.willPayload) +
      field('遗嘱 QoS', 'willQos', c.willQos, { select: true, items: [0, 1, 2] }) +
      '</div><label class="check"><input type="checkbox" data-cfg="willRetain"' + (c.willRetain ? ' checked' : '') + '> 遗嘱 Retain</label></div></section></aside>' +
      '<section class="center"><div class="logbox"><div class="loghead"><b>报文日志</b><span class="meta">' + state.messages.length + ' 条</span></div><div class="log">' + lines + '</div></div>' +
      dock +
      '<div class="compose"><div class="compose-top"><span class="note">发布到</span><input class="inp" data-pub="topic" value="' + esc(state.pub.topic) + '" style="flex:1">' +
      '<select data-pub="qos" style="width:64px"><option' + (state.pub.qos === 1 ? ' selected' : '') + '>1</option></select>' +
      '<label class="check" style="margin:0"><input type="checkbox" data-pub="retain"' + (state.pub.retain ? ' checked' : '') + '> Retain</label></div>' +
      '<textarea data-pub="payload">' + esc(state.pub.payload) + '</textarea>' +
      '<div class="sendside"><button class="btn pri sendbtn" data-act="pub">发布</button><button class="btn" data-act="clear-tx">清除</button></div>' +
      '<div class="sendfoot"><span>实发 ' + bytes(state.pub.payload) + ' 字节</span><span class="grow"></span><span>Ctrl+Enter</span></div></div></section>' +
      '<aside class="tools"><div class="tooltabs">' +
      '<button type="button" class="' + (state.tool === 'sub' ? 'on' : '') + '" data-act="tool" data-id="sub">订阅</button>' +
      '<button type="button" class="' + (state.tool === 'quick' ? 'on' : '') + '" data-act="tool" data-id="quick">快捷发布</button>' +
      '<button type="button" class="' + (state.tool === 'history' ? 'on' : '') + '" data-act="tool" data-id="history">历史发送</button>' +
      '<i class="rule"></i><button type="button" class="script ' + (state.tool === 'script' ? 'on' : '') + '" data-act="tool" data-id="script">脚本</button></div>' +
      '<div class="tool-body">' + tool + '</div></aside></div></main>' +
      '<footer class="status"><span><i class="lamp on" style="width:9px;height:9px"></i><b>' + esc(endpoint()) + ' OPENED, MQTT ' + esc(c.version) + ', ' + esc(c.clientId) + '</b></span>' +
      '<span>订阅 ' + state.subs.length + '</span><span class="last">Retain 末值 online</span></footer></div>' +
      (state.toast ? '<div class="toast' + (state.toast.bad ? ' bad' : '') + '">' + esc(state.toast.text) + '</div>' : '') + dlg;
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t || (t.classList.contains('mask') && e.target !== t)) return;
    var act = t.getAttribute('data-act');
    if (act === 'tool') { state.tool = t.getAttribute('data-id'); render(); }
    if (act === 'fold') { state.dock = false; render(); }
    if (act === 'add-sub') {
      state.dialog = { kind: 'sub', topic: '', qos: 0 };
      render();
    }
    if (act === 'toggle-sub') {
      state.subs.forEach(function (s) {
        if (s.id === t.getAttribute('data-id')) s.active = s.active === false;
      });
      render();
    }
    if (act === 'fill') {
      var item = state.pubTopics.find(function (x) { return x.id === t.getAttribute('data-id'); });
      if (item) { state.pub.topic = item.topic; toast('已填入 ' + item.topic); render(); }
    }
    if (act === 'add-topic') {
      state.dialog = { kind: 'topic', name: '', topic: '' };
      render();
    }
    if (act === 'resend') {
      var again = state.history[Number(t.getAttribute('data-id'))];
      if (again) publish(again.topic, again.qos, again.retain, again.payload, true);
    }
    if (act === 'fill-history') {
      var back = state.history[Number(t.getAttribute('data-id'))];
      if (!back) return;
      state.pub.topic = back.topic;
      state.pub.payload = back.payload;
      state.pub.qos = back.qos;
      state.pub.retain = back.retain;
      render();
    }
    if (act === 'clear-history') { state.history = []; render(); }
    if (act === 'pub') publish(state.pub.topic, state.pub.qos, state.pub.retain, state.pub.payload, true);
    if (act === 'quick') {
      var q = state.quick.find(function (x) { return x.id === t.getAttribute('data-id'); });
      if (!q) return;
      publish(q.inherit ? state.pub.topic : q.topic, q.inherit ? state.pub.qos : q.qos, q.inherit ? state.pub.retain : q.retain, q.data, false);
    }
    if (act === 'add-quick') {
      state.dialog = { kind: 'quick', id: '', name: '', data: '', key: '', inherit: true, topic: '', qos: 0, retain: false };
      render();
    }
    if (act === 'close-dlg') { state.dialog = null; render(); }
    if (act === 'save-dlg') {
      var errBox = document.getElementById('dlgErr');
      if (state.dialog.kind === 'sub') {
        if (!requireOpen('订阅')) return;
        var subTopic = document.getElementById('dlgTopic').value.trim();
        if (!subTopic) { errBox.textContent = '请填写 Topic'; return; }
        state.subs.push({ id: uid('s'), topic: subTopic, qos: Number(document.getElementById('dlgQos').value) || 0 });
        state.dialog = null;
        toast('已订阅 ' + subTopic);
        render();
        return;
      }
      if (state.dialog.kind === 'topic') {
        var topicName = document.getElementById('dlgName').value.trim();
        var topicValue = document.getElementById('dlgTopic').value.trim();
        if (!topicName) { errBox.textContent = '请填写名称'; return; }
        if (!topicValue) { errBox.textContent = '请填写 Topic'; return; }
        state.pubTopics.push({ id: uid('t'), name: topicName, topic: topicValue });
        state.dialog = null;
        render();
        return;
      }
      var inherit = document.getElementById('dlgInherit').checked;
      var name = document.getElementById('dlgName').value.trim();
      var data = document.getElementById('dlgData').value;
      var topicEl = document.getElementById('dlgTopic');
      var topic = topicEl ? topicEl.value.trim() : state.dialog.topic;
      var err = document.getElementById('dlgErr');
      if (!name) { err.textContent = '请填写名称'; return; }
      if (!data) { err.textContent = 'Payload 为空'; return; }
      if (!inherit && !topic) { err.textContent = '不沿用时必须填写 Topic'; return; }
      var saved = {
        id: state.dialog.id || uid('q'), name: name, data: data,
        key: document.getElementById('dlgKey').value,
        inherit: inherit, topic: topic,
        qos: inherit ? state.dialog.qos : Number((document.getElementById('dlgQos') || {}).value || 0),
        retain: inherit ? state.dialog.retain : !!(document.getElementById('dlgRetain') && document.getElementById('dlgRetain').checked)
      };
      var found = false;
      state.quick = state.quick.map(function (item) { if (item.id !== saved.id) return item; found = true; return saved; });
      if (!found) state.quick.push(saved);
      state.dialog = null;
      toast('快捷发布已保存');
      render();
    }
    if (act === 'run') toast('试算 before_publish，未发布');
    if (act === 'clear-tx') { state.pub.payload = ''; render(); }
    if (act === 'toggle') toast('本方向稿保持已连接，便于看订阅和发布');
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'dlgInherit') { state.dialog.inherit = el.checked; render(); var box = document.getElementById('dlgName'); if (box) box.focus(); return; }
    if (!el.hasAttribute('data-cfg')) return;
    var key = el.getAttribute('data-cfg');
    var prev = state.config.scheme;
    state.config[key] = el.type === 'checkbox' ? el.checked : el.value;
    if (key === 'scheme' && state.config.port === ports[prev]) state.config.port = ports[el.value];
    if (key === 'port' || key === 'keepAlive' || key === 'sessionExpiry' || key === 'willQos') state.config[key] = Number(el.value) || state.config[key];
    render();
  });
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.getAttribute('data-pub') === 'topic') state.pub.topic = el.value;
    if (el.getAttribute('data-pub') === 'payload') state.pub.payload = el.value;
    if (el.getAttribute('data-draft') === 'topic') state.draftSub.topic = el.value;
    if (el.hasAttribute('data-draft-pub')) state.draftPub[el.getAttribute('data-draft-pub')] = el.value;
  });
  render();
})();
</script>
</body>
</html>
